# Gateway validation — what a real gateway did with this configuration.
# Re-run gateway/verify.sh against your own environment before you rely on it.

gateway_validation:
  solution: 06-hmac-auth
  version: 1.0.0

  plugin_availability:
    status: PASS
    detail: >-
      GET /api/orgs/{orgId}/plugin-schemas?page=1&size=300 returned 96 plugins
      including hmac-auth (category Authentication, priority 2530). The
      Authentication category on this build is authz-casbin, authz-casdoor,
      authz-keycloak, basic-auth, cas-auth, forward-auth, helix-auth, hmac-auth,
      ldap-auth, multi-auth, opa, openid-connect. key-auth and jwt-auth are
      absent, as the platform model says — hmac-auth is not in that category of
      hidden plugin.

  schema_confirmation:
    status: PASS
    detail: >-
      The live schema for hmac-auth confirms exactly the fields this spec uses:
      allowed_algorithms (enum hmac-sha1/sha256/sha512, default all three),
      clock_skew (default 300), signed_headers (array, NO default), 
      validate_request_body (default false), hide_credentials (default false),
      anonymous_consumer, realm (default "hmac"). consumer_schema requires key_id
      and secret_key with secret_key in encrypt_fields. There is no secret field
      on the route schema, which is why no placeholder appears in the spec.

  import:
    status: PASS
    detail: >-
      HTTP 200 — the OpenAPI document and both hmac-auth blocks were accepted.
      Read back from the created revision, the mapping is: the document-root
      x-helix-gateway.plugins became serviceSpec.plugins (request-id), and each
      per-method block became that route's plugins with signed_headers intact.
      The OpenAPI path parameter /posts/{postId} was rewritten to /posts/:postId
      in the route spec.

  dry_run:
    status: PASS
    detail: '{"success": true, "message": "Dry-run validation successful"} with an upstream bound.'

  deployment:
    status: DEPLOYED
    detail: >-
      Deployed to a TEMPORARY test API on a test environment; the revision went
      ACTIVE. A product with authMethods ["hmac-auth"], and an app created with
      plugins {"hmac-auth": {}}, produced a key_id/secret_key pair in the create
      response exactly as documented. Every resource created was deleted
      afterwards and the routes now return 404.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: verify.sh exits 0 — all eight cases pass as written, unmodified.
    cases:
      - { id: unauthenticated,   expected_status: 401, result: PASS }
      - { id: signed-post,       expected_status: 201, result: PASS, note: "the signing base this package documents is the one the gateway rebuilds" }
      - { id: tampered-body,     expected_status: 401, result: PASS, note: "the Digest genuinely binds the body" }
      - { id: stale-date,        expected_status: 401, result: PASS, note: "clock_skew enforced at 300s" }
      - { id: wrong-secret,      expected_status: 401, result: PASS, note: "the secret is verified, not just the key_id" }
      - { id: weak-signed-set,   expected_status: 401, result: PASS, note: "signed_headers enforced — rejected before the signature is checked" }
      - { id: replay,            expected_status: 201, result: PASS, note: "ACCEPTED again, as documented. There is no nonce." }
      - { id: signed-get,        expected_status: 200, result: PASS, note: "no-digest signing set on the read route" }
    client_cross_check:
      status: PASS
      detail: >-
        Before deployment, the signing function in verify.sh was compared against
        an independent reimplementation of the plugin's generate_signature. Both
        signed sets produced identical signatures, and each of the three
        draft-cavage deviations — omitting the keyId line, dropping the trailing
        newline, and cavage's lowercase "(request-target)" form — produced a
        different one. The live run then confirmed the same construction end to end.

  additional_findings:
    path_binding:
      status: PASS
      detail: >-
        @request-target binds the path, confirmed by request: a signature minted
        for GET /posts/1 returns 200 on /posts/1 and 401 when replayed against
        /posts/2.
    error_body_grouping:
      status: CORRECTED
      detail: >-
        Exactly two failures are explained to the caller — a missing Authorization
        header, and one that does not begin with "Signature". Both are raised while
        PARSING. Everything raised during VALIDATION is collapsed to
        "client request can't be validated", and that includes
        "keyId or signature missing", which is raised inside validate() after
        parsing has succeeded. An earlier draft of this package listed that third
        case as explained; the live run disproved it and the README is corrected.
    api_product_enforcer_composition:
      status: PASS
      detail: >-
        Previously recorded as untested. api-product-enforcer (error_policy
        fail_close) was added to the signed POST route and the product quota set to
        3/minute: three signed requests returned 201 and the next three returned
        429 {"error":"quota exceeded"}, while the route without the enforcer kept
        returning 200. The enforcer resolves the consumer and credential_id from
        hmac-auth with no extra configuration. NOTE the x-ratelimit-* headers on
        these responses are NOT from the enforcer — they appear identically on a
        route with no enforcer on it, so they are a gateway-level default (1000/s).

  overall: READY
