# Local (pre-gateway) validation — a structural review of the importable
# artifacts. It does not, and cannot, establish gateway behaviour. Nothing here
# implies a gateway accepted this configuration.

local_validation:
  solution: 06-hmac-auth
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; products.json parses as JSON; verify.sh parses under bash -n
    schema:                  PASS   # every hmac-auth field used (signed_headers, validate_request_body, clock_skew, allowed_algorithms, hide_credentials, realm) is read from the live plugin schema — none invented, none guessed
    required_fields:         PASS   # both routes carry signed_headers; the POST route pairs digest in the signed set with validate_request_body true
    references:              PASS   # no cross-route shared value exists to mismatch — unlike a shared signing secret, each route stands alone
    plugin_ordering:         PASS   # hmac-auth runs in the rewrite phase at priority 2530, ahead of the upstream; request-id is service-scoped and order-independent here
    plugin_scoping:          PASS   # hmac-auth is per-route because the two routes need different signed sets; the consequence (a new route is unauthenticated by default) is stated in the README and solution.yaml
    plugin_compatibility:    PASS   # request-validation is deliberately absent — priority 2800 re-encodes the body ahead of the 2530 digest check
    auth_authz_dependencies: PASS   # nothing on either route depends on context hmac-auth has not yet produced; no authorization plugin is present
    request_response:        PASS   # documented 201/200/401/404 responses match the design; every rejection path is a 401
    security:                PASS   # no secret appears in any artifact and none can — hmac-auth's route schema has no secret field; key_id and secret_key are provisioned on the app credential by the control plane
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; all explanation is in YAML comments
    tests_match_impl:        PASS   # all eight verify.sh cases map to routes and plugin fields that exist in the spec; the two manual cases are flagged as such in tests/test-plan.yaml
    client_implementation:   PASS   # verify.sh's signing function was compared against an independent reimplementation of the plugin's signature construction; both signed sets produce identical signatures, and each of the three draft-cavage deviations was shown to produce a different one
    placeholders:            PASS   # <YOUR_GATEWAY_HOST>, <KEY_ID>, <SECRET_KEY>, <API_ID>, <ORG_ID>, <ENV_ID>, <PRODUCT_ID> — no real hosts, org ids or personas

  warnings:
    - >-
      signed_headers is NOT in the plugin's defaults and is the field that makes
      this configuration secure. Omit it and the client decides what its own
      signature covers: a signature over nothing but the keyId validates and
      replays against any body and any path indefinitely. validate_request_body
      does not close that gap, because with digest outside the signed set the
      caller supplies both the body and the matching Digest. Reviewers should
      treat its removal as a security change, not a simplification.
    - >-
      hmac-auth is applied per route rather than at the document root, so a route
      added later with no x-helix-gateway block is UNAUTHENTICATED. This is a
      deliberate trade for per-route signed sets, and the fail-safe alternative
      (a root-level block plus the empty-body digest constant) is documented.
    - >-
      There is no replay protection inside clock_skew. The plugin has no nonce
      field and no replay cache, so a captured request is valid until its Date
      ages out. Test case 7 asserts this rather than describing it.
    - >-
      Off-the-shelf draft-cavage HTTP Signatures libraries do NOT interoperate.
      The keyId line, the required trailing newline and the @request-target form
      each differ from cavage, and each alone changes the signature.
    - >-
      request-validation cannot be added to a signed route. It runs earlier in the
      same phase (2800 vs 2530) and re-encodes the parsed JSON body, so the digest
      comparison fails on key order and whitespace with only a bare 401 to show
      for it.
    - >-
      Validation failures return an identical opaque 401 — bad signature, bad
      digest, clock skew, unknown key_id and a weak signed set are
      indistinguishable to the caller. Correct security behaviour, and genuinely
      hard for an honest integrator to self-diagnose; the detail is in the gateway
      log, which is why request-id is on the API.
    - >-
      Date is a forbidden header in browsers, so this scheme cannot be driven from
      browser JavaScript. Callers must be servers, devices or partner backends.
    - >-
      @request-target covers the query string, so any intermediary that
      normalises, reorders or appends query parameters invalidates every signature
      it touches.
    - >-
      Metering is out of scope here by choice, not by limitation: api-product-enforcer
      added to a signed route meters per app exactly as solution 01 describes, which
      was tested against a deployed route.
    - >-
      The upstream is bound on the service at import/bind time, not expressed in
      the OpenAPI paths. Nothing in this document can confirm it is reachable.

  assumptions:
    - API "Partner Events API" with signed paths POST /posts and GET /posts/{postId}. All illustrative.
    - The caller can hold a long-lived secret and run signing code; clocks are accurate to within clock_skew.
    - One product with authMethods ["hmac-auth"], one developer, one app per integration provides the key_id/secret_key used in testing.

  not_established_here:
    # This file is the PRE-GATEWAY review and deliberately stays that way: what a
    # structural read can and cannot settle does not change because a later stage
    # passed. The request-path results live in gateway-validation.yaml.
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether hmac-auth in this org exposes these exact fields at deploy time.
    - Any request/response behaviour whatsoever — including whether the signing
      base this package documents is the one a deployed route rebuilds. The
      client implementation was cross-checked against the plugin's algorithm;
      that is not the same as having sent a request. It subsequently was — see
      validation/gateway-validation.yaml, which records verify.sh at 8/8.
