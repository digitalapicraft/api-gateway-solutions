problem:
  statement: A partner, device fleet or webhook sender holds a credential that travels on every
    request — so any copy of one request is a copy of the credential — and that credential says
    nothing about the payload it arrived with, so a body altered in transit is indistinguishable
    from a legitimate one.
business_need:
  summary: Authenticate inbound traffic in a way that survives the credential being observed,
    and detect a payload altered in transit, without a client-side release to rotate anything
    and without the backend learning about authentication. A captured request becomes worth one
    request for at most clock_skew seconds, instead of granting indefinite impersonation.
implementation:
  gateway_capabilities:
  - hmac-auth (POST route)
  - hmac-auth (GET route)
  - request-id
  custom_code_required: false
  notes: 'hmac-auth is applied PER ROUTE, not at the document root, because the two routes need
    different signed sets: POST has a body the signature must cover, GET does not, and requiring
    a digest of the empty string is ceremony rather than security. The cost is that a route added
    later without an x-helix-gateway block is unauthenticated; the fail-safe alternative is a
    root-level block carrying the POST configuration. signed_headers is the field that makes this
    configuration secure and it is NOT in the plugin''s defaults. Without it the client chooses
    what its own signature covers, and a signature over nothing but the keyId replays against
    any body and any path indefinitely. validate_request_body does not close that gap, because
    with digest outside the signed set the caller supplies both the body and the matching Digest.
    NO SECRET APPEARS IN THE SPEC AND NONE CAN — hmac-auth''s route schema has no secret field.
    key_id and secret_key live on the app credential, which the control plane generates and returns
    once. This is the structural difference from solution 02, whose signing_secret is a literal
    in the spec. request-validation CANNOT share a route with validate_request_body: it runs earlier
    in the same phase (2800 vs 2530) and re-encodes the body, so the digest comparison fails on
    key order and whitespace.'
  plugins:
  - name: hmac-auth
    scope: route
    at: POST /posts · GET /posts/{postId}
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
