assumptions:
  - API name is "Partner Events API" and the signed paths are POST /posts and GET /posts/{postId} (illustrative — replace with yours).
  - The caller is a server, device or partner backend that can hold a long-lived secret and run signing code. A browser or mobile app cannot, and needs a token flow instead.
  - Caller clocks are accurate to within clock_skew (300s here). A fleet without NTP produces 401s that look like credential failures.
  - One app per integration, so a compromised secret is rotated for one partner rather than all of them.
  - The upstream is bound on the service at import/bind time, not in the OpenAPI paths.
  - No intermediary between the caller and the gateway normalises, reorders or appends query parameters — @request-target covers the query string, so any such rewrite invalidates every signature.

limitations:
  - Authentication and message integrity, not authorization. The signature proves who called and that the message is intact; it carries no scopes and no per-route permissions.
  - No replay protection inside clock_skew. The plugin schema has no nonce field and there is no replay cache — a captured request is valid until its Date ages out. Closing it needs idempotency upstream plus the smallest clock_skew your callers tolerate. Demonstrated as test case 7 rather than asserted.
  - Symmetric secrets, so no non-repudiation. The gateway can forge a caller's signature as easily as verify it; the signature proves the message came from someone holding the secret, not which end.
  - No expiry on a credential. A secret_key is valid until somebody rotates it — nothing bounds it the way a token TTL does.
  - Rotation is a cutover, not a rolling change. Rotating regenerates key_id and secret_key together and the old pair stops working immediately; there is no previous-secret grace period.
  - The integration cost lands on the caller, who must get canonicalisation byte-exact. Off-the-shelf draft-cavage libraries do NOT interoperate — the keyId line, the trailing newline and the @request-target form each differ.
  - Not usable from browser JavaScript. Date is a forbidden header for fetch and XHR, and a secret shipped to a user's device is not a secret.
  - request-validation cannot be added to a signed route. It re-encodes the body ahead of the digest check.
  - Metering is not included here, but it does compose: api-product-enforcer added to a signed route meters per app exactly as solution 03 describes (tested — a 3/minute quota gave three 201s then 429 "quota exceeded"). This is a scope decision, not a limitation of signing.
  - hmac-auth's exact schema varies by build. Confirm with get_plugin_config in your org before deploying rather than trusting the field names in this spec.

status: READY   # deployed to a temporary test API and verified: verify.sh exit 0, 8/8
