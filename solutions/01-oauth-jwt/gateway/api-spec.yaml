# Solution 01 — OAuth 2.0 client credentials with gateway-issued JWTs.
#
# This is the importable artifact: an OpenAPI 3.0.3 document carrying
# x-helix-gateway.plugins. Two ways to use it: paste the agent prompt into Agent
# Mode (it creates the API and binds the upstream for you), or import this file,
# bind the upstream, set a signing secret, and deploy the revision.
#
# RUNNABLE ON A FRESH FREE-TRIAL ORG. The upstream is the public
# https://jsonplaceholder.typicode.com, so GET /posts and GET /posts/{postId}
# return real data with no backend of your own. Swap in your real upstream when
# you have one — nothing else changes. Validated against a Helix gateway: no
# token -> 401, a valid token -> 200 with real posts.
#
# ENVIRONMENT: a free-trial org gets a "test" environment by default — deploy here.
#
# WHAT THIS DOES
#   POST /oauth/token  — the gateway verifies the app's client_id/client_secret
#                        and signs a short-lived JWT. Deliberately NOT behind
#                        validation: a caller has no token yet.
#   everything else    — the gateway verifies the JWT it signed and rejects
#                        anything else in the access phase, before the request
#                        reaches the upstream.
#
# ROUTES MATCH THE UPSTREAM PATHS, so no proxy-rewrite is needed — a request to
# /posts is forwarded to the upstream's /posts unchanged. (Validated.)
#
# EXECUTION IS PRIORITY/PHASE-ORDERED, NOT DOCUMENT-ORDERED. helix-auth validate
# runs in the access phase, so a rejected request never reaches the upstream.
#
# THE SIGNING SECRET MUST MATCH on the issue route and every validate route.
# A mismatch rejects every freshly issued token with an opaque error — the single
# most common way this is deployed wrong.
#
# THE SIGNING SECRET IS A LITERAL — replace <YOUR_JWT_SIGNING_SECRET> with a real,
# high-entropy value before deploy. The gateway does NOT resolve <ENV:...> or
# ${...} syntax; the string is used verbatim as the HMAC key. Shipping the
# placeholder makes your key a public constant. Keep the filled-in spec out of
# version control. App client_id/client_secret are provisioned on the credential
# by the control plane and never appear here.
#
# EXTERNAL ISSUER? If Keycloak / Auth0 / Entra ID / Okta issues the tokens, drop
# the /oauth/token route and keep helix-auth in validate mode with
# validate_auth_type jwt-auth pointed at the issuer's key material. NOTE: jwt-auth
# and key-auth are validate_auth_type VALUES of helix-auth, not standalone plugins.

openapi: 3.0.3

info:
  title: Posts API
  version: 1.0.0
  description: >-
    A sample API protected with OAuth 2.0 client-credentials JWTs issued and
    verified at the gateway. It proxies the public jsonplaceholder service, so it
    returns real data on a fresh org; point it at your own upstream when ready.

paths:
  /oauth/token:
    post:
      summary: Issue an OAuth 2.0 access token (client credentials grant)
      description: >-
        Exchange an app's client credentials for a short-lived JWT. Send
        `Authorization: Basic base64(client_id:client_secret)`. Returns
        `access_token`, `token_type` and `expires_in`. Unknown or mismatched
        credentials are rejected with 401.
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, description: Signed JWT }
                  token_type:   { type: string, example: Bearer }
                  expires_in:   { type: integer, description: Seconds until expiry }
        '401': { description: Unknown client_id, or client_secret does not match }
      x-helix-gateway:
        plugins:
          # Own-JWT issuance. generate mode verifies the credential's key
          # (client_id) and secret (client_secret) and signs a JWT. It is also the
          # only mode that checks the secret. Use helix-auth generate — not a
          # standalone plugin, which does not exist on this build.
          helix-auth:
            mode: generate
            token_ttl: 900                          # 15 minutes — see README § Choosing a token lifetime
            signing_secret: "<YOUR_JWT_SIGNING_SECRET>"

  /posts:
    get:
      summary: List posts
      description: Requires a valid Bearer token issued by POST /oauth/token. Proxies the upstream's /posts.
      responses:
        '200': { description: Array of posts }
        '401': { description: Missing, malformed, expired or badly signed Bearer token }
      x-helix-gateway:
        plugins:
          # Identity, access phase. Rejects anything without a valid JWT this
          # gateway signed, before the request reaches the upstream.
          # signing_secret MUST equal the value on /oauth/token.
          helix-auth:
            mode: validate
            validate_auth_type: jwt-auth
            signing_secret: "<YOUR_JWT_SIGNING_SECRET>"

    post:
      summary: Create a post
      description: Requires a valid Bearer token. Proxies the upstream's POST /posts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, userId]
              properties:
                title:  { type: string }
                body:   { type: string }
                userId: { type: integer }
      responses:
        '201': { description: Created }
        '400': { description: Invalid payload }
        '401': { description: Missing or invalid Bearer token }
      x-helix-gateway:
        plugins:
          helix-auth:
            mode: validate
            validate_auth_type: jwt-auth
            signing_secret: "<YOUR_JWT_SIGNING_SECRET>"

  /posts/{postId}:
    get:
      summary: Get a post
      description: Requires a valid Bearer token. Proxies the upstream's /posts/{postId}.
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Post }
        '401': { description: Missing, malformed, expired or badly signed Bearer token }
        '404': { description: Not found }
      x-helix-gateway:
        plugins:
          helix-auth:
            mode: validate
            validate_auth_type: jwt-auth
            signing_secret: "<YOUR_JWT_SIGNING_SECRET>"

# API-WIDE POLICY.
#
# Note what is NOT here: helix-auth validate is applied per route rather than
# API-wide, because /oauth/token must stay reachable without a token. Applying
# validate at the document root would protect the token endpoint too, and no
# caller could ever obtain a first token — every request would return 401,
# including the one that issues credentials.
x-helix-gateway:
  plugins:
    # Correlation id on every call, including the token exchange, so an auth
    # failure can be traced across the gateway and your backend logs.
    request-id:
      algorithm: uuid
      header_name: X-Request-Id

    # Browser access. authorization MUST be in allow_headers or a browser client
    # cannot send the Bearer token — the preflight fails and you see a CORS error
    # rather than a 401, which sends people debugging the wrong layer.
    cors:
      allow_origins: "*"
      allow_methods: "GET,POST,OPTIONS"
      allow_headers: "authorization,content-type"
      allow_credential: false
