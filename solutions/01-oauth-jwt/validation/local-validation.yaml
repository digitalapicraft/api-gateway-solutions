# Local (pre-gateway) validation — a structural review of the importable
# artifacts. It does not, and cannot, establish gateway behaviour. Nothing here
# implies a gateway accepted this configuration.

local_validation:
  solution: 01-oauth-jwt
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; verify.sh parses under bash
    schema:                  PASS   # helix-auth (mode/token_ttl/signing_secret/validate_auth_type), request-id, cors — all fields drawn from confirmed usage, none invented
    required_fields:         PASS   # generate route carries token_ttl + signing_secret; every validate route carries validate_auth_type + signing_secret
    references:              PASS   # issue route and all three validate routes reference the identical <ENV:JWT_SIGNING_SECRET>
    plugin_ordering:         PASS   # helix-auth validate runs in the access phase, ahead of the upstream; request-id and cors are API-wide and order-independent here
    plugin_scoping:          PASS   # validate is per-route on /posts*, deliberately NOT at the document root, so POST /oauth/token stays reachable without a token
    auth_authz_dependencies: PASS   # /oauth/token is intentionally unprotected; nothing on the protected routes depends on context helix-auth has not yet produced
    request_response:        PASS   # documented 200/401/403/404 responses match the design; every rejection path is a 401
    security:                PASS   # no literal secrets anywhere; signing_secret is <ENV:JWT_SIGNING_SECRET>; client_id/client_secret are provisioned on the credential by the control plane and never written to config
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; all explanation is in YAML comments
    tests_match_impl:        PASS   # all six verify.sh cases map to routes and plugins that exist in the spec; the four manual cases are flagged as such in tests/test-plan.yaml
    placeholders:            PASS   # <UPSTREAM_URL>, <YOUR_GATEWAY_HOST>, <ORG_ID>, <CLIENT_ID>, <CLIENT_SECRET>, <ENV:JWT_SIGNING_SECRET> — no real hosts, org ids or personas

  warnings:
    - >-
      helix-auth's exact schema varies by build. The fields used here are drawn
      from confirmed usage, but confirm with get_plugin_config in YOUR org before
      deploying rather than trusting this spec's field names.
    - >-
      cors.allow_origins is "*", which is right for a public partner API and wrong
      for anything carrying browser session state. allow_credential is false, which
      is what makes the wildcard safe here — do not set it true without narrowing
      the origins.
    - >-
      Applying helix-auth validate API-wide instead of per-route would protect
      POST /oauth/token and make obtaining a first token impossible. The spec is
      correct as written; the warning exists because it is the change an editor is
      most likely to make for tidiness.
    - >-
      token_ttl 900 is a deliberate choice, not a platform default. It is the only
      bound on a leaked token's usefulness. Reviewers should treat it as a value to
      set consciously per environment.
    - >-
      The upstream is bound on the service at import/bind time, not expressed in
      the OpenAPI paths. Nothing in this document can confirm it is reachable.
    - >-
      Symmetric signing means anyone able to verify a token is also able to sign
      one. Adequate when the gateway is the only verifier; insufficient if a third
      party must verify independently.

  assumptions:
    - API "Posts API" with protected paths /posts, /posts/{postId}; token endpoint POST /oauth/token. All illustrative.
    - The gateway is the token issuer; no external identity provider is involved.
    - JWT_SIGNING_SECRET exists on the target environment before the revision is deployed.
    - One developer with one app provides the client_id/client_secret used in testing.

  not_established_here:
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether helix-auth in this org exposes these exact fields.
    - Whether the environment variable resolves at request time.
    - Any request/response behaviour whatsoever.

  performed_by: helix-solution-builder
  verified_this_session: true
