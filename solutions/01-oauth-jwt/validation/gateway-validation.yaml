# Gateway validation — this solution was imported, dry-run, deployed and exercised
# against a gateway. The statuses below are the outcome. Re-run
# gateway/verify.sh against your own environment before you rely on it.

gateway_validation:
  solution: 01-oauth-jwt
  version: 1.0.0

  dry_run:
    status: PASS
    detail: >-
      Non-destructive dry-run passed. A dry-run before an upstream is bound
      correctly fails with "upstream not configured — set upstream binding first",
      which is the intended safety check.

  deployment:
    status: DEPLOYED
    detail: >-
      Imported cleanly (x-helix-gateway.plugins maps root -> service, per-method ->
      route; service_id is assigned automatically), then deployed ACTIVE.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: verify.sh exits 0 — all six cases pass as written.
    cases:
      - { id: unauthenticated,         expected_status: 401, result: PASS }
      - { id: token-issue,             expected_status: 200, result: PASS, note: "three-segment HS256 JWT; expires_in matches token_ttl" }
      - { id: valid-token,             expected_status: 200, result: PASS }
      - { id: forged-token,            expected_status: 401, result: PASS, note: "signature is actually verified" }
      - { id: wrong-secret,            expected_status: 401, result: PASS, note: "the client secret is checked — a real credentials flow" }
      - { id: malformed-authorization, expected_status: 401, result: PASS }

  agent_prompt_run:
    executor: the hosted agent, default model
    date: 2026-09-21
    status: PASS
    detail: >-
      Four routes written, helix-auth flat on every one: generate/jwt-auth with
      token_ttl 900 on POST /oauth/token, validate/jwt-auth on the /posts
      routes. Correctly used one shared signing_secret across issue and
      validate.
    verified_by: >-
      get_revision read back after the run; the stored routeSpec was inspected
      directly, not inferred from the agent transcript.

  overall: READY
