# Solution manifest — the traceability spine for this package.
# Every artifact below corresponds to this one solution version. If the gateway
# config changes, bump `version` and re-derive the docs and infographic from it
# — never the other way round.

solution:
  name: OAuth 2.0 with JWT, without touching the backend
  slug: 01-oauth-jwt
  version: 1.0.0
  category:
    - Security & Access
  tags: [oauth2, jwt, client-credentials, authentication, helix-auth, token-endpoint]

problem:
  statement: >-
    API teams need standards-based authentication on a partner-facing API because
    static keys never expire and a public API is a standing risk, without waiting
    for a backend release cycle to thread auth through every request handler.

business_need:
  summary: >-
    Move authentication to the edge so it ships in a configuration change instead
    of a backend release, and bound the exposure window of a compromised
    credential from indefinite (a static key) to the token lifetime (minutes).
    Identity resolved here is also the prerequisite for per-app metering and
    per-app analytics.

implementation:
  gateway_capabilities:
    - helix-auth (mode generate)            # POST /oauth/token — verifies client_id/secret, signs the JWT
    - helix-auth (mode validate, jwt-auth)  # protected routes — verifies the signature and expiry, access phase
    - request-id                            # correlation across the auth failure and the backend
    - cors                                  # browser access; authorization must be in allow_headers
  custom_code_required: false
  notes: >-
    helix-auth generate is used because the GATEWAY is the token issuer. If an
    external identity provider (Keycloak, Auth0, Entra ID, Okta) already issues
    the tokens, this solution is the wrong shape: drop the token route and use the
    jwt-auth plugin as a verifier against that issuer instead. The two are not
    interchangeable implementations — they sit on opposite sides of the issuer
    boundary.
    validate is applied PER ROUTE, not API-wide, so POST /oauth/token stays
    reachable without a token. Applying it at the document root makes obtaining a
    first token impossible and every request returns 401.
    The signing secret must resolve to the same value on the issue route and every
    validate route; nothing in either plugin block hints that the value is shared.

