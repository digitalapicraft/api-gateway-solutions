assumptions:
  - API name is "Orders API" and the protected paths are /orders* (illustrative — replace with yours).
  - The token endpoint is POST /oauth/token (illustrative; any path works).
  - token_ttl is 900 seconds. This is a deliberate choice, not a platform default —
    it is the only bound on a leaked token's usefulness. Pick it for your own risk
    tolerance and tell integrators to cache and refresh at ~80% of the lifetime.
  - The gateway is the token issuer and no external identity provider is involved.
  - JWT_SIGNING_SECRET exists as an environment variable on the target environment
    BEFORE the revision is deployed.
  - The upstream is bound on the service at import/bind time, not in the OpenAPI paths.

limitations:
  - Client credentials authenticates the APPLICATION, not an end user. No end-user
    identity and no consent are established. Delegated user access needs the
    authorization code flow, which this is not.
  - This is authentication, not authorization. The token proves who is calling; it
    carries no scopes and no per-route permissions in this configuration.
  - No token revocation list. Disabling an app stops NEW tokens; already-issued
    tokens remain valid until they expire. The TTL is therefore the security
    control, not app status.
  - No refresh tokens — client credentials does not use them. The client re-exchanges
    its long-lived secret instead.
  - Symmetric signing — one shared secret both signs and verifies, so anyone able to
    verify is also able to sign. Independent third-party verification would require
    asymmetric keys and is out of scope.
  - Rotating the signing secret invalidates tokens issued under the old value the
    moment the new one is live. With a 900s TTL the blast radius is bounded to
    roughly fifteen minutes of 401s, but it is not a zero-downtime change as written.
  - All four caller-side failure causes (no header, missing Bearer prefix, expired,
    bad signature) return an indistinguishable 401. Correct security behaviour, and
    genuinely hard for integrators to self-diagnose — document the causes and give
    them X-Request-Id.
  - helix-auth's exact schema varies by build. Confirm with get_plugin_config before
    deploying rather than trusting the field names in this spec.

status: UNVALIDATED   # generated + locally reviewed; auth mechanism proven in a prior internal build, this artifact not gateway-confirmed
