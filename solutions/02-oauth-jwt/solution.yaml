# `nav` drives the tab strip and the gate's required-file list;
# `implementation.plugins` must match gateway/api-spec.yaml exactly.

layout: v2
solution:
  name: OAuth 2.0 with JWT, without touching the backend
  slug: 02-oauth-jwt
  title: OAuth 2.0 with JWT
  summary: The gateway issues the token and verifies it, so a partner-facing API gets standards-based
    authentication in a configuration change rather than a backend release.
  version: 1.1.0
  released: 2026-08-18
  updated: 2026-09-25
  category: Security & Access
  categories:
  - Security & Access
  tags:
  - oauth2
  - jwt
  - client-credentials
  - authentication
  - helix-auth
  - token-endpoint
facts:
  setup_time: ~15 minutes
  difficulty: Beginner
  needs:
  - A fresh org (its default test environment)
  - a real signing-secret value to paste into the spec (used literally — see below)
  - one developer + app to test with. The upstream is public jsonplaceholder, so no backend of
    your own
  plugins:
  - helix-auth
  - request-id
  - cors
  build_with:
  - agent
  - openapi-import
