problem:
  statement: API teams need standards-based authentication on a partner-facing API because static
    keys never expire and a public API is a standing risk, without waiting for a backend release
    cycle to thread auth through every request handler.
business_need:
  summary: Move authentication to the edge so it ships in a configuration change instead of a
    backend release, and bound the exposure window of a compromised credential from indefinite
    (a static key) to the token lifetime (minutes). Identity resolved here is also the prerequisite
    for per-app metering and per-app analytics.
implementation:
  plugins:
  - name: helix-auth
    mode: generate
    scope: route
    at: POST /oauth/token
    role: Verifies client_id and client_secret, then signs and returns the JWT.
  - name: helix-auth
    mode: validate
    scope: route
    at: GET /posts · POST /posts · GET /posts/{postId}
    role: Verifies the signature and expiry of a token this gateway minted, in the access phase.
      Applied per route, never at the document root — at the root the token endpoint itself needs
      a token and no first token can be obtained.
  - name: request-id
    scope: document
    role: Correlates an auth failure with the backend call that followed it.
  - name: cors
    scope: document
    role: Browser access. `authorization` must appear in allow_headers or the preflight rejects
      every authenticated call.
  custom_code_required: false
  notes: 'helix-auth generate is used because the GATEWAY is the token issuer. If an external
    identity provider (Keycloak, Auth0, Entra ID, Okta) already issues the tokens, this solution
    is the wrong shape: drop the token route and use the openid-connect plugin as a verifier against
    that issuer instead (solution 05-okta-jwt). helix-auth cannot do it — no JWKS URL, issuer
    or audience field, and additionalProperties:false. The two are not interchangeable implementations
    — they sit on opposite sides of the issuer boundary. The signing secret must resolve to the
    same value on the issue route and every validate route; nothing in either plugin block hints
    that the value is shared.'
relations:
  pairs_with:
