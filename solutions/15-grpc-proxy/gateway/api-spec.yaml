# =============================================================================
# 15-grpc-proxy — the gateway in front of a bidirectional-streaming gRPC
# service: authentication at connection initiation, concurrency caps per
# caller, and connection telemetry, without touching the service.
#
# READ THIS FIRST — THIS PACKAGE IS SHAPED DIFFERENTLY FROM EVERY OTHER ONE.
#
# The OpenAPI document does NOT describe the gRPC-ness of this API. It cannot:
# OpenAPI has no way to say "this upstream speaks gRPC". That lives on the
# UPSTREAM object in the control plane, which is a separate resource bound to a
# revision per environment:
#
#   POST /api/orgs/{orgId}/envs/{envId}/upstreams
#   {"name":"timing-grpc","specification":{
#      "scheme":"grpc",                       <-- or grpcs for TLS
#      "type":"roundrobin","pass_host":"node",
#      "nodes":[{"host":"<GRPC_UPSTREAM_HOST>","port":<GRPC_UPSTREAM_PORT>,
#                "weight":1,"priority":1}]}}
#
# So this file is only half the configuration, and the README says so plainly.
#
# GOTCHA: changing an upstream's `scheme` does NOT propagate to an already
# deployed revision. Editing the upstream and redeploying is not enough — you
# must UNDEPLOY and DEPLOY again. Nothing warns you; the route keeps its old
# behaviour.
#
# ROUTE PATHS ARE gRPC METHOD PATHS: /<package>.<Service>/<Method>, always POST.
# They are not a design choice; they are what a gRPC client puts on the wire.
#
# ONE STREAM IS ONE REQUEST. Every access-phase plugin evaluates exactly once,
# at stream initiation — which is what makes "authenticate the connection" work
# at all. It also means a product quota counts STREAMS, NOT MESSAGES: one
# long-lived connection carrying a million messages consumes one unit. Verified
# with a limit-count of 1, which allowed five messages on one stream and then
# rejected the next stream.
#
# WHY THERE IS NO CONCURRENCY CAP HERE. `limit-conn` is the obvious control for
# long-lived connections, and it is deliberately ABSENT because it did not work
# when tested. With `conn: 2`, four concurrent streams were all accepted — keyed
# on `consumer_name` and again on `remote_addr`. The same shape DID cap streams
# on stock APISIX locally (conn 2, third stream refused 503), so the difference
# is in the deployment and is not explained. Do not copy a `limit-conn` block in
# here and assume it caps anything: open more streams than the limit and watch.
#
# DO NOT ADD A BODY-TOUCHING PLUGIN TO THESE ROUTES. Anything that buffers or
# rewrites a body — response-rewrite, xml-to-json, request-validation,
# pgp-crypto, mocking — assumes a request that ends. A stream does not, and the
# plugin will break it.
#
# THE ENVIRONMENT MATTERS MORE THAN THE CONFIG. If an HTTP/1.1 intermediary sits
# in front of the data plane, gRPC trailers are silently dropped and every call
# ends "server closed the stream without sending trailers" even though the
# payload arrives. Check for it BEFORE you build on this — see the README's
# "Check your path first" section. Verified working where no such hop exists.
#
# NO SECRETS ARE IN THIS FILE. The caller's key is provisioned by the control
# plane onto an app credential and never appears in a spec.
# =============================================================================

openapi: 3.0.3

info:
  title: Timing Unit Stream API
  version: 1.0.0
  description: >-
    A bidirectional-streaming gRPC service exposed through the gateway. Timing
    units hold a connection open for hours; the gateway authenticates each one as
    it connects, caps how many a single caller may hold, and records how long
    each stayed open — none of which the service has to implement.

paths:
  /timing.TimingUnit/Ping:
    post:
      summary: Unary health probe
      description: >-
        Unary, so it is the cheapest way to prove the path works end to end
        before you debug a stream. If this returns cleanly and a streaming method
        does not, the problem is trailers, not routing.
      responses:
        '200': { description: gRPC response }
        '401': { description: Missing or invalid API key, rejected before the upstream is contacted }
      x-helix-gateway:
        plugins:
          helix-auth:
            mode: validate
            validate_auth_type: key-auth
            apikey:
              source: header
              key: X-Unit-Key

  /timing.TimingUnit/Status:
    post:
      summary: Bidirectional status stream
      description: >-
        Long-lived. The unit sends hardware status; the server acknowledges and
        pushes back. Authentication happens once, when the stream opens.
      responses:
        '200': { description: gRPC bidirectional stream }
        '401': { description: Missing or invalid API key }
      x-helix-gateway:
        plugins:
          helix-auth:
            mode: validate
            validate_auth_type: key-auth
            apikey:
              source: header
              key: X-Unit-Key


  /timing.TimingUnit/Commands:
    post:
      summary: Bidirectional command channel
      description: >-
        The server pushes commands down an open stream. Same policy as Status —
        authenticated once at initiation, and counted against the same
        concurrency cap.
      responses:
        '200': { description: gRPC bidirectional stream }
        '401': { description: Missing or invalid API key }
      x-helix-gateway:
        plugins:
          helix-auth:
            mode: validate
            validate_auth_type: key-auth
            apikey:
              source: header
              key: X-Unit-Key


# API-wide. request-id gives you a handle for a caller reporting a dropped
# stream; it is the only way to correlate one connection across the telemetry.
#
# Deliberately NOT here: any body-touching plugin, and any CORS block — a gRPC
# client is not a browser, and grpc-web is a different solution.
x-helix-gateway:
  plugins:
    request-id:
      algorithm: uuid
      header_name: X-Request-Id
