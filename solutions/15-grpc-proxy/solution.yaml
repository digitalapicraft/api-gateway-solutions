problem:
  statement: Platform teams need identity and admission control on a bidirectional-streaming gRPC
    service whose clients hold connections open for hours, because today every such service implements
    its own credential check and the connections are invisible to the platform, without modifying
    the service or interrupting the stream.
business_need:
  summary: Move authentication for streaming services to the edge, where it happens once as the
    connection opens, so a streaming service gains auth as configuration rather than as code,
    cutting off a client becomes an administrative act rather than a deploy, and per-connection
    duration becomes attributable to a caller in telemetry the service does not produce.
implementation:
  gateway_capabilities:
  - helix-auth (mode validate, key-auth)
  - request-id
  - gRPC reflection routes (v1 + v1alpha)
  - upstream scheme grpc
  custom_code_required: false
  notes: 'This package is shaped differently from every other one in the library: the OpenAPI
    document is only half the configuration. OpenAPI cannot express "this upstream speaks gRPC",
    so that lives on the upstream object in the control plane and is bound to the revision per
    environment. Importing the document alone produces routes that proxy over HTTP to a gRPC port.

    One stream is one request. Every access-phase plugin evaluates exactly once, at stream initiation
    — which is what makes authenticating a connection possible, and which also means product quota
    counts STREAMS, NOT MESSAGES. Measured, not assumed.'
  plugins:
  - name: helix-auth
    scope: route
    at: POST /timing.TimingUnit/Ping · POST /timing.TimingUnit/Status · POST /timing.TimingUnit/Commands
      · POST /grpc.reflection.v1alpha.ServerReflection/ServerReflectionInfo · POST /grpc.reflection.v1.ServerReflection/ServerReflectionInfo
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
