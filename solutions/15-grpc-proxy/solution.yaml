# Solution manifest — the traceability spine for this package.
# Every artifact below corresponds to this one solution version.

solution:
  name: A bidirectional gRPC stream, authenticated at the edge
  slug: 15-grpc-proxy
  version: 1.0.0
  category:
    - Security & Access
    - Protocols & Mediation
  tags: [grpc, bidirectional-streaming, http2, long-lived-connections, helix-auth, key-auth, trailers]

problem:
  statement: >-
    Platform teams need identity and admission control on a bidirectional-streaming
    gRPC service whose clients hold connections open for hours, because today every
    such service implements its own credential check and the connections are
    invisible to the platform, without modifying the service or interrupting the
    stream.

business_need:
  summary: >-
    Move authentication for streaming services to the edge, where it happens once
    as the connection opens, so a streaming service gains auth as configuration
    rather than as code, cutting off a client becomes an administrative act rather
    than a deploy, and per-connection duration becomes attributable to a caller in
    telemetry the service does not produce.

implementation:
  gateway_capabilities:
    - helix-auth (mode validate, key-auth)  # resolves the credential from gRPC metadata, ONCE, at stream initiation
    - request-id                            # correlation handle for a caller reporting a dropped stream
    - upstream scheme grpc                  # a CONTROL-PLANE object, not part of this document
  custom_code_required: false
  notes: >-
    This package is shaped differently from every other one in the library: the
    OpenAPI document is only half the configuration. OpenAPI cannot express "this
    upstream speaks gRPC", so that lives on the upstream object in the control
    plane and is bound to the revision per environment. Importing the document
    alone produces routes that proxy over HTTP to a gRPC port.

    One stream is one request. Every access-phase plugin evaluates exactly once,
    at stream initiation — which is what makes authenticating a connection
    possible, and which also means product quota counts STREAMS, NOT MESSAGES.
    Measured, not assumed.

    Whether this works at all is a property of the network path rather than the
    configuration. gRPC carries its status in HTTP/2 trailers; an HTTP/1.1 hop in
    front of the data plane drops them, and every call then delivers its payload
    and reports failure. Verified working where no such hop exists and failing
    where one does.

validation:
  local: PASS_WITH_WARNINGS
  gateway_dry_run: PASS
  deployment: DEPLOYED
  functional_test: PASS
  record: validation/

artifacts:
  documentation: [README.md, architecture.md, business-need.md]
  source_code: [gateway/api-spec.yaml, gateway/verify.sh]
  agent_prompt: helix-agent-prompt.md
  diagrams: [README.md]
  tests: [tests/test-plan.yaml, tests/requests/, tests/expected/]
  validation: [validation/local-validation.yaml, validation/gateway-validation.yaml]

assumptions:
  - The service, package and method names in the paths are illustrative. Replace
    them with yours; they must match the gRPC wire paths exactly.
  - The credential arrives in gRPC metadata as X-Unit-Key. Metadata travels as
    HTTP/2 headers, which is why a header-sourced key works.
  - The upstream speaks plaintext gRPC (h2c) on its own port. TLS to the upstream
    (grpcs) is NOT verified here.
  - Clients hold a proto or protoset out of band; the gateway does not proxy the
    gRPC reflection service unless you route it.
  - The data plane has no HTTP/1.1 intermediary in front of it.

limitations:
  - An HTTP/1.1 hop anywhere in front of the data plane strips HTTP/2 trailers, so
    every call delivers its payload and then fails with "server closed the stream
    without sending trailers". There is no configuration-level workaround; the
    backend protocol must be HTTP/2. Check with `curl -sI | grep -i '^via:'`.
  - The gRPC upstream is a separate control-plane object. This document alone is
    not a working configuration.
  - Changing an upstream's scheme does not propagate to a deployed revision — you
    must undeploy and deploy again, and nothing warns you.
  - Product quota counts streams, not messages. One connection carrying a million
    messages consumes one unit.
  - Authentication is evaluated once, at initiation. A credential revoked while a
    stream is open remains effective until that stream ends.
  - Gateway rejections are not valid gRPC responses — 401 arrives as an HTTP
    status with a text/plain body and no grpc-status trailer, so a misconfigured
    client and a broken network path look identical to the caller.
  - No concurrency cap is included. limit-conn did not cap concurrent streams when
    tested on this build, keyed on consumer_name and again on remote_addr, while
    the equivalent configuration did cap them on stock APISIX locally.
  - Live per-caller concurrency is not observable. The open-connection gauge has
    no route, API or consumer labels; per-consumer duration is available but only
    once a stream closes.
  - No plugin that reads or rewrites a body can sit on these routes.
  - Streams were held open for tens of seconds, not hours. Long holds are unproven.
  - mTLS and client-certificate identity are out of scope.

status: READY WITH WARNINGS   # 5/5 functional on a path with no HTTP/1.1 hop; environment-dependent by nature
