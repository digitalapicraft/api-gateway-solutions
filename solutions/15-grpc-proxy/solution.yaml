assumptions:
- The service, package and method names in the paths are illustrative. Replace them with yours;
  they must match the gRPC wire paths exactly.
- The credential arrives in gRPC metadata as X-Unit-Key. Metadata travels as HTTP/2 headers, which
  is why a header-sourced key works.
- The upstream speaks plaintext gRPC on its own port. For a TLS backend, set the upstream scheme
  to grpcs and its TLS port; nothing else changes.
- Clients discover the schema through the routed reflection endpoints.
limitations:
- The gRPC upstream is a separate control-plane object. This document alone is not a working configuration.
- Changing an upstream's scheme does not propagate to a deployed revision — you must undeploy
  and deploy again, and nothing warns you.
- Product quota counts streams, not messages. One connection carrying a million messages consumes
  one unit.
- Authentication is evaluated once, at initiation. A credential revoked while a stream is open
  remains effective until that stream ends.
- Gateway rejections are not valid gRPC responses — 401 arrives as an HTTP status with a text/plain
  body rather than a gRPC response, so the caller sees an opaque transport error rather than "your
  key is missing".
- A stream's telemetry is recorded when it closes, which is when its duration becomes known. Counts
  over a recent window answer "how many are open" for every practical purpose.
- No plugin that reads or rewrites a body can sit on these routes.
- Both reflection versions must be routed for schema discovery to work. A client tries v1 first
  and only falls back to v1alpha if that attempt answers cleanly.
- mTLS and client-certificate identity are out of scope.
status: READY
