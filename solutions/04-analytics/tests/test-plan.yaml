# Test plan — analytics on a deliberately minimal API (two routes, no auth).
#
# verify.sh (gateway/verify.sh) covers the automated part: both routes answer 200
# with real data and carry X-Request-Id, and it seeds a labelled burst of
# distinct /posts/{postId} ids. The analytics assertions are MANUAL — analytics is
# captured asynchronously and read from the analytics API or portal; no script can
# assert a chart.
#
# Substitute your own values:
#   {{GATEWAY}}   gateway base URL, e.g. https://<YOUR_GATEWAY_HOST>

meta:
  solution: 04-analytics
  version: 1.0.0
  executor: gateway/verify.sh
  note: >-
    The API is intentionally minimal — two routes returning real data via
    the jsonplaceholder upstream, no auth, no other plugins. It exists to generate traffic you
    then slice in analytics.

cases:
  - id: list-route
    type: positive
    intent: GET /posts returns the real data and a correlation id.
    request: requests/list.http
    expected: expected/list-200.json
    expected_status: 200
    assertions:
      - response carries an X-Request-Id header

  - id: item-route-templated
    type: positive
    intent: >-
      GET /posts/{postId} returns the real data. Several distinct ids are
      sent so the templating check below has data.
    request: requests/item.http
    expected: expected/item-200.json
    expected_status: 200

  - id: path-templating
    type: manual
    intent: >-
      THE CHECK THAT MATTERS. The distinct /posts/{postId} calls aggregate to ONE
      row when grouped by the route_id analytics dimension, versus one row per id
      when grouped by api_path.
    procedure: >-
      After verify.sh seeds several ids, query the analytics metrics API (or portal)
      grouped by route_id, then by api_path, filtered to this API. route_id should
      show one row for the item route; api_path should show one row per id.
    expected: one row by route_id; one row per concrete id by api_path
    notes: >-
      Group route-level charts by route_id. Confirmed against a gateway. See
      charts.md.

  - id: correlation-id
    type: manual
    intent: The X-Request-Id on a response can be found in your backend's own logs for that call.
    procedure: Take an X-Request-Id from a response and grep your backend logs for it.
    expected: the same id present in both places
    notes: X-Request-Id is a log-side correlation tool, not an analytics dimension.

  - id: per-app-attribution
    type: manual
    intent: >-
      OPTIONAL / compose-in. Per-app attribution requires identity on the routes
      (helix-auth, solution 01). This minimal API has none, so analytics attributes
      to a source IP.
    procedure: >-
      Add helix-auth to the routes (see solution 01), call with an app's credential,
      then group analytics by app_name / developer / product_name.
    expected: with identity resolved, rows attribute to the calling app; without it, to an IP.

coverage:
  positive: [list-route, item-route-templated]
  manual:   [path-templating, correlation-id, per-app-attribution]
