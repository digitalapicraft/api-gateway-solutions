# Gateway validation — this solution was imported, dry-run and deployed against a
# gateway; the analytics claims were confirmed by querying the analytics API.
# Re-run gateway/verify.sh against your own environment before you rely on it.

gateway_validation:
  solution: 04-analytics
  version: 1.0.0

  dry_run:
    status: PASS
    detail: The spec contains NO analytics plugin and deploys cleanly — analytics is global.

  deployment:
    status: DEPLOYED
    detail: Two simple routes ACTIVE — /orders and the templated /orders/{orderId} — each returning a standard response via the mocking plugin.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: verify.sh calls the two routes, seeds a labelled traffic pattern, and confirms X-Request-Id is present.

  analytics_verification:
    status: VERIFIED
    method: control-plane analytics metrics API, filtered by api_name and grouped by dimensions.
    findings:
      - Analytics is global — with no analytics plugin in the spec, every call is captured and queryable.
      - Path templating holds — several distinct /orders/{orderId} values aggregate to ONE row grouped by route_id, versus one row per id grouped by api_path. Group route-level charts by route_id.
      - Per-app attribution is available WHEN identity is resolved (add helix-auth, see solution 01); without it, rows attribute to a source IP.
      - X-Request-Id is NOT an analytics dimension — correlate a single request in your own logs via the forwarded header.

  overall: READY

what_you_should_do:
  - Do NOT add an analytics plugin; it is global.
  - Group route-level analytics by route_id (templated), not api_path (concrete path).
  - Add helix-auth (solution 01) if you need per-app attribution rather than per-IP.
  - Confirm your retention window covers the queries in charts.md.
