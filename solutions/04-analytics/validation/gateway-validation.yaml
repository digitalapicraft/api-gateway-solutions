# Gateway validation — this solution builds nothing, so there is no dry-run/deploy.
# What was validated is that the READ QUERIES work against the live analytics API.
# Re-run scripts/query-analytics.sh against your own org and token to see your data.

analytics_validation:
  solution: 04-analytics
  version: 2.0.0

  changes_to_apis: none

  live_queries:
    status: VERIFIED
    method: POST /api/orgs/{orgId}/analytics/metrics/{metric} against a live gateway (read-only).
    confirmed:
      - Requests in the last hour grouped by api_name — one row per API, sortable busiest-first.
      - The same grouped by app_name and by product_name; unauthenticated traffic lands in an unattributed bucket.
      - Slowest and fastest APIs by AVG response-time, using server-side sort on value (DESC / ASC).
      - Error picture by api_name + response_status_code (200 / 401 / 429 all distinguished).
      - scripts/query-analytics.sh executed end to end and printed every view.
    metrics_available: [REQUESTS_PER_SECOND, REQUESTS_COUNT, RESPONSE_TIME, REQUEST_SIZE, RESPONSE_SIZE, TOTAL_TRANSFER_SIZE, UPSTREAM_RESPONSE_TIME]
    dimensions_available: [env_name, app_id, app_name, product_name, api_name, route_id, route_name, api_path, request_method, response_status_code, upstream_path, developer]
    filter_operators: [EQ, NEQ, GT, GTE, LT, LTE, IN, LIKE, NOT_LIKE]

  confirmed_limits:
    - No percentiles — response-time supports AVG/MIN/MAX/SUM only (a percentile aggregation is rejected).
    - No quota-usage metric — 429s can be counted, but not "percent of a limit used".
    - X-Request-Id is not a dimension — correlate a single request in your own logs.

  overall: READY   # read-only; all documented queries verified live

what_you_should_do:
  - Get a control-plane bearer token (the portal uses the same one).
  - Run scripts/query-analytics.sh with your CP host, ORG and TOKEN.
  - For per-app / per-product rows, make sure the API resolves identity (solution 01/03); otherwise traffic is unattributed.
