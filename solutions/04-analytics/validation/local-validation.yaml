# Local (pre-gateway) validation — a structural review of the importable artifacts.
# It does not, and cannot, establish gateway behaviour; see gateway-validation.yaml
# for what a real gateway established.

local_validation:
  solution: 04-analytics
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; verify.sh parses under bash
    schema:                  PASS   # request-id, cors — fields drawn from confirmed usage, none invented
    no_analytics_plugin:     PASS   # CONFIRMED: no helix-analytics block anywhere. Analytics is global; adding one is the mistake this package exists to prevent. The name appears only in explanatory comments.
    minimal_surface:         PASS   # two routes only (/posts, /posts/{postId}), each with just the jsonplaceholder upstream returning real data — no auth, quota or transform on the routes
    path_templating:         PASS   # /posts/{postId} is a path PARAMETER, so it collapses to one row grouped by route_id (one row per id if grouped by api_path)
    correlation_id:          PASS   # request-id applied API-wide with header_name X-Request-Id; a correlation tool for a log-side join, not an analytics dimension
    plugin_scoping:          PASS   # request-id and cors are API-wide; routes have no plugins (plain proxy)
    request_response:        PASS   # both routes return 200 with a real jsonplaceholder data
    security:                PASS   # no secrets, no auth, no literal credentials anywhere
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; explanation is in YAML comments
    tests_match_impl:        PASS   # verify.sh and test-plan cover the two routes; per-app attribution is flagged as a compose-in (solution 01), not asserted here
    placeholders:            PASS   # <YOUR_GATEWAY_HOST> only — no real hosts, org ids or personas

  warnings:
    - >-
      Per-app attribution is NOT part of this minimal API. It requires identity on the
      routes (helix-auth, solution 01); without it analytics attributes to a source IP.
      This is deliberate — the API is kept simple. Compose solution 01 when you need it.
    - >-
      Group route-level analytics by the route_id dimension, not api_path. route_id
      collapses a templated path to one row; api_path gives one row per concrete id.
    - >-
      X-Request-Id is a log-side correlation tool, not an analytics dimension. Narrow
      analytics to a slice, then match the id in your own logs.
    - >-
      The premise is that analytics is enabled globally on the target platform. Nothing
      in this document can confirm that for a given org.
    - >-
      Charts 5-7 in charts.md need solution 03 (quota consumption requires a quota).
    - >-
      With the jsonplaceholder upstream the routes never proxy, but the platform still wants an
      upstream bound to the service. Bind any reachable placeholder.

  assumptions:
    - API "Posts API" with /posts and /posts/{postId}. Illustrative.
    - Routes proxy the public jsonplaceholder upstream; swap in your own when you have one.
    - Analytics is enabled globally via helix-analytics.

  not_established_here:
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether analytics is enabled globally in your org.
    - Whether route_id aggregates a templated path to one row (a live analytics query).
    - Any request/response behaviour whatsoever.

  performed_by: helix-solution-builder
  verified_this_session: true
