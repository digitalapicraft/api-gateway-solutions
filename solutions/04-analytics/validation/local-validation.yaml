# Local (pre-query) validation — a structural review of the guide and script.

local_validation:
  solution: 04-analytics
  version: 2.0.0
  status: PASS

  checks:
    changes_to_apis:      PASS   # none — no gateway/api-spec.yaml, no plugin, no deploy step
    query_shape:          PASS   # every query in charts.md matches POST /analytics/metrics/{metric} with valid dimensions/filters/aggregation
    metrics_valid:        PASS   # only real metrics used; AVG/MIN/MAX/SUM applied only to size/time metrics
    dimensions_valid:     PASS   # only real dimensions used for grouping/filtering
    filter_operators:     PASS   # only supported operators (EQ/NEQ/GT/GTE/LT/LTE/IN/LIKE/NOT_LIKE)
    limits_documented:    PASS   # no percentiles, no quota-usage metric, no per-request lookup, no bodies — all stated up front
    script_syntax:        PASS   # scripts/query-analytics.sh parses under bash and is read-only (POSTs to the metrics read API only)
    placeholders:         PASS   # <YOUR_CONTROL_PLANE_HOST>, <YOUR_ORG_ID>, token from the portal — no secrets or org identifiers

  not_established_here:
    - Whether your specific org has data in a given window (that is a live query).
    - Whether a given API resolves identity (that depends on how the API is built).

  performed_by: helix-solution-builder
  verified_this_session: true
