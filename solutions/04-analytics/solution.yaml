problem:
  statement: API teams need to see what's happening across their APIs — requests in the last hour
    by API, product or app; the slowest and fastest APIs; error rates — without standing up their
    own telemetry and without changing any API. The gateway already captures every request; the
    gap is knowing how to query it.
business_need:
  summary: 'Turn always-on capture into answers on demand: per-API / per-product / per-app request
    volume, latency ranking, and error breakdowns for any window, read straight from the metrics
    API with no configuration and no risk (read-only).'
implementation:
  changes_to_apis: none
  how_you_read_it: 'Three ways, same data: ask the agent in plain English (it calls its get_metrics
    tool and renders a chart), run scripts/query-analytics.sh from the CLI, or POST the metrics
    API directly — /api/orgs/{orgId}/analytics/metrics/{metric} with dimensions, filters and an
    optional sort. helix-agent-prompt.md has the prompts; charts.md is the raw catalogue.'
  capabilities_used:
  - 'metrics: requests-count, requests-per-second, response-time, request-size, response-size,
    total-transfer-size, upstream-response-time'
  - 'dimensions: env_name, app_id, app_name, product_name, api_name, route_id, route_name, api_path,
    request_method, response_status_code, upstream_path, developer'
  - 'filter operators: EQ, NEQ, GT, GTE, LT, LTE, IN, LIKE, NOT_LIKE (AND-combined)'
  - server-side sort on value (top-N slowest/busiest) and timeUnit bucketing for time series
  custom_code_required: false
  notes: 'Attribution depends on how each API is ALREADY built, not on anything you add here:
    per-app / per-developer / per-product rows need the API to resolve identity (helix-auth),
    or that traffic lands in an unattributed bucket. Group route-level views by route_id (a templated
    route is one row) rather than api_path (one row per concrete id).'
  plugins: []
