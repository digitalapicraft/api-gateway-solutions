# Solution manifest — the traceability spine for this package.
# This solution BUILDS NOTHING on your APIs. It is a read-only guide + script for
# pulling the analytics the gateway already captures.

solution:
  name: "Analytics: read what your gateway already captured"
  slug: 04-analytics
  version: 2.0.0
  category:
    - Observability & Operations
  tags: [analytics, metrics-api, requests, latency, attribution, read-only, reporting]

problem:
  statement: >-
    API teams need to see what's happening across their APIs — requests in the last
    hour by API, product or app; the slowest and fastest APIs; error rates — without
    standing up their own telemetry and without changing any API. The gateway
    already captures every request; the gap is knowing how to query it.

business_need:
  summary: >-
    Turn always-on capture into answers on demand: per-API / per-product / per-app
    request volume, latency ranking, and error breakdowns for any window, read
    straight from the metrics API with no configuration and no risk (read-only).

implementation:
  changes_to_apis: none   # analytics is global; nothing is added to any API
  how_you_read_it: >-
    A structured metrics API — POST /api/orgs/{orgId}/analytics/metrics/{metric}
    with dimensions, filters and an optional sort — or the portal over it. NOT a
    natural-language prompt to the agent (the agent builds APIs; it does not read
    charts). scripts/query-analytics.sh runs the common views; charts.md is the
    full catalogue.
  capabilities_used:
    - "metrics: requests-count, requests-per-second, response-time, request-size, response-size, total-transfer-size, upstream-response-time"
    - "dimensions: env_name, app_id, app_name, product_name, api_name, route_id, route_name, api_path, request_method, response_status_code, upstream_path, developer"
    - "filter operators: EQ, NEQ, GT, GTE, LT, LTE, IN, LIKE, NOT_LIKE (AND-combined)"
    - "server-side sort on value (top-N slowest/busiest) and timeUnit bucketing for time series"
  custom_code_required: false
  notes: >-
    Attribution depends on how each API is ALREADY built, not on anything you add
    here: per-app / per-developer / per-product rows need the API to resolve
    identity (helix-auth), or that traffic lands in an unattributed bucket. Group
    route-level views by route_id (a templated route is one row) rather than
    api_path (one row per concrete id).

limits:
  # Real limits of the metrics API — do not promise a report built on these.
  - No percentiles. response-time supports AVG/MIN/MAX/SUM only. MAX is the tail signal.
  - No quota-usage metric. 429s can be counted; "percent of a limit used" is not available.
  - No per-request lookup. X-Request-Id is not a dimension; correlate in your own logs.
  - No request/response bodies — metadata only, by design.

validation:
  local:
    status: PASS
    basis: structural review of charts.md and scripts/query-analytics.sh against the analytics metadata (metrics, dimensions, filter operators).
    verified_this_session: true
  live_queries:
    status: VERIFIED
    detail: >-
      Every view was run against the live analytics API and returned the expected
      shapes: requests in the last hour grouped by api_name / app_name /
      product_name / response_status_code; slowest and fastest APIs by AVG
      response-time (server-side sort on value); error counts by status.
      scripts/query-analytics.sh was executed end to end and printed all views.
    verified_this_session: true

artifacts:
  documentation: [README.md, charts.md, architecture.md, business-need.md]
  script: scripts/query-analytics.sh
  infographic: [infographic.md]
  validation: [validation/local-validation.yaml, validation/gateway-validation.yaml]
  note: >-
    No gateway/api-spec.yaml, no tests/, no agent prompt — this solution changes no
    API and builds nothing. charts.md + scripts/query-analytics.sh are the deliverable.

assumptions:
  - Analytics is enabled globally on the platform (it is on this build). Every request is captured.
  - You have APIs already receiving traffic; the queries read whatever exists.
  - Reads use a control-plane bearer token (the same one the portal uses).

status: READY   # read-only guide + script; all queries verified against the live analytics API
