# Solution 16 — Request tracing: the basic example spec.
#
# Two routes and nothing else: no plugins. Import this when you want to add the
# plugins yourself in the UI, so you see what each one does. The walkthrough is
# ../guides.md, "Build it in the UI".
#
# The same API with the plugins already in it is api-spec.yaml, next to this file.
#
# RUNNABLE ON A FRESH FREE-TRIAL ORG. The upstream is public
# https://jsonplaceholder.typicode.com, so every route returns real data with no
# backend of your own.

openapi: 3.0.3

info:
  title: Posts API
  version: 1.0.0
  description: >-
    A sample API to investigate with a trace session. It proxies the public
    jsonplaceholder service, so it returns real data on a fresh org. Add the
    plugins yourself to give a trace something to show.

paths:
  /posts:
    post:
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
      responses:
        '201': { description: Created (jsonplaceholder echoes the post with an id) }
        '400': { description: The body has no title. The gateway answers this once you add request-validation. }

  /posts/{postId}:
    get:
      summary: Get a post
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Post }
        '404': { description: No such post }
