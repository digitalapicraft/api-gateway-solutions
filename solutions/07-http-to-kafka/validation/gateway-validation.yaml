# Gateway validation — what a real gateway did with this configuration.
# Re-run gateway/verify.sh, and the manual Kafka cases, against your own
# environment before you rely on it.

gateway_validation:
  solution: 07-http-to-kafka
  version: 1.0.0

  plugin_availability:
    status: PASS
    detail: >-
      GET /api/orgs/{orgId}/plugin-schemas?page=1&size=300 returned 96 plugins
      including kafka-logger (Observability, priority 403), mocking
      (Transformation, priority 1999), request-validation (Traffic, priority 2800)
      and request-id. The priorities are the ones the design depends on and were
      read from the org rather than assumed.

  schema_confirmation:
    status: PASS
    detail: >-
      kafka-logger's schema carries a oneOf requiring either broker_list or
      brokers, plus kafka_topic — this spec uses brokers. Confirmed defaults that
      are overridden here: producer_type "async", required_acks 1, max_retry_count
      0, batch_max_size 1000, max_req_body_bytes 524288. mocking's
      with_mock_header defaults to true, which is why the spec sets it false.

  import:
    status: PASS
    detail: >-
      HTTP 200 — the OpenAPI document and all three route plugins were accepted.
      Read back from the created revision, the mapping is: the document-root
      x-helix-gateway.plugins became serviceSpec.plugins (request-id), and the
      per-method block became the route's plugins. The nested structures survive
      import intact — kafka-logger's _meta.filter [["status","==",202]], its
      log_format object, and request-validation's full body_schema including
      required and per-property minLength.

  dry_run:
    status: PASS
    detail: '{"success": true, "message": "Dry-run validation successful"} with an upstream bound.'

  deployment:
    status: DEPLOYED
    detail: >-
      Deployed to a TEMPORARY test API against a real Kafka cluster, publishing to
      a dedicated topic created for the run and deleted afterwards. The demo topic
      on that cluster was deliberately not written to. Every resource created was
      removed; the route now returns 404.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: verify.sh exits 0 — all four edge-contract cases pass as written.
    cases:
      - { id: valid-event,            expected_status: 202, result: PASS }
      - { id: correlation-id,         expected_status: 202, result: PASS }
      - { id: schema-rejected,        expected_status: 400, result: PASS }
      - { id: mock-header-suppressed, expected_status: 202, result: PASS }
    kafka_leg:
      status: PASS
      detail: >-
        Confirmed on the topic, not inferred from a status code.
      cases:
        - id: message-on-topic
          result: PASS
          detail: >-
            The published message carries the posted body in full under "event",
            plus request_id and received_at. Key order is the re-encoded order,
            because request-validation re-serialises the body — the same behaviour
            that makes it incompatible with hmac-auth, here observed directly.
        - id: rejected-event-not-published
          result: PASS
          detail: >-
            Two valid events produced exactly two messages; the malformed event
            that returned 400 produced none. _meta.filter on status == 202 works.
        - id: broker-down-still-202
          result: PASS
          detail: >-
            With brokers[].host pointed at an unroutable address, two valid events
            each returned 202 at normal latency (~0.56s) and nothing reached the
            topic. The headline limitation, demonstrated.
        - id: topic-autocreate-drops-first
          result: NOT_EXECUTED
          detail: >-
            Needs a broker with auto.create.topics.enable and a topic that does not
            yet exist. Not run.

  corrections:
    request_id_variable:
      severity: BUG
      detail: >-
        The shipped log_format used "$request_id", which does NOT equal the
        X-Request-Id returned to the caller, so the correlation field correlated
        with nothing. Proven by logging three candidates on one request and
        comparing: $request_id was 32 hex chars with no dashes and did not match;
        $apisix_request_id and $http_x_request_id both matched the returned header
        exactly. Cause: ngx_tpl seeds $apisix_request_id from nginx's $request_id,
        then the request-id plugin overwrites $apisix_request_id with its own UUID
        and never touches $request_id. The spec now uses $apisix_request_id.
    request_validation_not_load_bearing:
      severity: FALSE_CLAIM_WITHDRAWN
      detail: >-
        This package previously claimed — as DERIVED_NOT_OBSERVED — that removing
        request-validation would leave every published message with an empty event
        field, because mocking short-circuits the access phase before
        kafka-logger's include_req_body read can run. The short-circuit is real and
        readable in the sources, but the conclusion is FALSE. Tested twice: with
        request-validation removed the event field was complete, and with
        include_req_body set to false it was complete again. $request_body resolves
        independently of both. The claim has been withdrawn everywhere it appeared
        rather than softened, and request-validation is now justified only by what
        it actually does — rejecting malformed events at the edge.

  observations:
    extra_log_fields:
      detail: >-
        Published messages carry route_id and service_id in addition to the keys
        named in log_format. Harmless, but do not assume log_format is the complete
        set when writing a consumer schema.

  agent_prompt_run:
    executor: the hosted agent, default model
    date: 2026-09-21
    status: PASS with a documented limitation
    detail: >-
      Seven runs. The shipped prompt (literal route object, required-only
      body_schema) lands the route with all three plugins correctly keyed,
      _meta.filter nested inside kafka-logger, $apisix_request_id in log_format,
      with_mock_header false, and request-id at the API level. A property-level
      body_schema fails 5 runs out of 5: the agent tool-call serialiser
      transposes its closing delimiters (emits ...1}}]}} where ...1}}}]} is
      valid), the call never reaches the control plane and nothing is written.
      Removing that one nesting level made the identical prompt succeed. One run
      also dropped the plugin-name level entirely, writing the mocking fields as
      four top-level plugin names — write reported success, dry-run passed,
      route had no mocking.
    limitation: >-
      The agent path cannot install the property-level body_schema in
      gateway/api-spec.yaml. Spec import is unaffected and is the documented
      route to the full schema.
    verified_by: >-
      get_revision read back after every run; the stored routeSpec was
      inspected directly, and the malformed tool arguments were recovered from
      the run transcripts and re-parsed to locate the corruption.

  overall: READY
