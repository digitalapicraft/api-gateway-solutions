# Test plan — HTTP to Kafka ingest at the edge.
#
# Cases 1-4 are executed in order by ../gateway/verify.sh, which exits 0 only if
# all of them hold. Cases 5-8 are MANUAL and are verified in your own Kafka topic
# browser, because nothing observable from the caller's side can establish them.
#
# That split is the honest shape of this solution, not a gap in the tooling: the
# gateway publishes from the log phase, after the response has been flushed, so
# no response at any point reflects whether the produce succeeded.
#
# Substitute your own values:
#   {{GATEWAY}}   gateway base URL, e.g. https://<YOUR_GATEWAY_HOST>

meta:
  solution: 07-http-to-kafka
  version: 1.0.0
  executor: gateway/verify.sh
  note: >-
    Cases 1-4 are automated. Cases 5-8 need a running broker and a topic browser,
    and three of them need the broker deliberately broken, so all four are manual.
  status: >-
    EXECUTED. Cases 1-4 were run by verify.sh against a deployed route (exit 0),
    and cases 5, 6 and 7 were confirmed against a real Kafka cluster using a
    dedicated test topic that was deleted afterwards. Case 8 (topic auto-creation)
    was NOT run — it needs a broker with auto.create.topics.enable and a topic that
    does not yet exist.

cases:
  - id: valid-event
    type: positive
    intent: >-
      A well-formed event is acknowledged by the gateway itself, with no upstream
      contacted, proving the ingest endpoint needs no service behind it.
    request: requests/valid-event.http
    expected: expected/accepted-202.json
    response_notes: >-
      The body is the mocking plugin's configured response_example, verbatim. If
      you see anything else — an upstream's payload, an error page — something
      other than mocking answered and the route is proxying when it should be
      short-circuiting.
      READ THE STATUS AS "the gateway accepted this event", NOT "Kafka has this
      event". Those are different claims and only the first one is being made.
    expected_status: 202
    notes: >-
      A 404 means the route is not deployed. A 400 means request-validation
      rejected an event matching the shipped schema — compare body_schema against
      the payload.

  - id: correlation-id
    type: positive
    intent: >-
      The acknowledgement carries the correlation id that the published message
      also carries, which is the only reliable way to match a request to a message.
    request: requests/correlation.http
    expected: expected/request-id-202.json
    response_notes: >-
      X-Request-Id on the response equals the request_id field inside the Kafka
      message, because log_format writes the same nginx variable. On a busy topic
      this pairing is what makes the manual cases below assertions rather than
      eyeballing — timestamps cannot distinguish two events posted in the same
      second, and received_at is the gateway's clock, not yours.
    expected_status: 202
    notes: >-
      If this header is absent, request-id is missing from the API-level plugins.
      Everything still works; the Kafka half simply becomes unverifiable.

  - id: schema-rejected
    type: negative
    intent: >-
      A malformed event is rejected at the edge, and — because the publish is
      filtered on status — is not published either.
    request: requests/invalid-event.http
    expected: expected/invalid-event-400.json
    response_notes: >-
      rejected_code and rejected_msg as configured on request-validation. mocking
      never runs, so there is no 202; kafka-logger's _meta.filter requires
      status == 202, so nothing is published.
    expected_status: 400
    notes: >-
      Two independent things are being tested and both matter. WITHOUT the
      _meta.filter, kafka-logger's log phase runs for a 400 exactly as it does for
      a 202, and rejected events reach the topic by the back door. Confirm the
      absence of a message for this request in the Kafka UI as well — case 6.

  - id: mock-header-suppressed
    type: boundary
    intent: >-
      The acknowledgement does not advertise that it was generated by a mocking
      plugin.
    request: requests/no-mock-header.http
    expected: expected/no-mock-header-202.json
    expected_status: 202
    notes: >-
      with_mock_header defaults to TRUE and stamps every response with a header
      naming the plugin and the gateway version. This spec sets it false. The case
      exists because the default is wrong for a production endpoint and is the
      easiest field to leave untouched.

  - id: message-on-topic
    type: positive
    intent: >-
      Establish that the event actually reached Kafka with a NON-EMPTY body — the
      single thing this solution exists to do, and the single thing no response
      code can tell you.
    type_of_execution: manual
    procedure: >-
      1) Run gateway/verify.sh and keep the event_id and X-Request-Id it prints.
      2) Open your topic browser (Kafka UI, Redpanda Console, or
         `kafka-console-consumer.sh --from-beginning`) on the configured topic.
      3) Find the newest messages and locate the one whose request_id matches.
    expected_outcome: >-
      A message shaped {"event":"<the JSON you posted>","request_id":"<the same
      id the 202 returned>","received_at":"<gateway timestamp>"}. The event field
      must contain your payload.
    notes: >-
      CONFIRMED against a real broker: the event field carries the posted body in
      full. Note the key ORDER will be the re-encoding's rather than yours, because
      request-validation re-serialises the body — that is expected and is the same
      behaviour that makes it incompatible with hmac-auth.
      An earlier version of this plan warned that an empty event field was the
      likely failure if request-validation were removed. That was tested and is
      false: the body is published with request-validation removed, and with
      include_req_body set to false. Correlate on request_id, which must come from
      $apisix_request_id — $request_id never matches the header the caller got.

  - id: rejected-event-not-published
    type: negative
    intent: >-
      Confirm the _meta.filter actually prevents a rejected event from reaching
      the topic.
    type_of_execution: manual
    procedure: >-
      Post the malformed event from case 3, note the time, then check the topic
      for any message produced at that moment.
    expected_outcome: >-
      No message. The only messages on the topic correspond to 202 responses.
    notes: >-
      Remove _meta.filter and repeat to see the alternative: the 400 is published
      too, with the malformed body in the event field, and your consumers inherit
      validation you thought you had done at the edge.

  - id: broker-down-still-202
    type: failure
    intent: >-
      Demonstrate the headline limitation by execution: with the broker
      unreachable, the caller cannot tell.
    type_of_execution: manual
    procedure: >-
      Stop the broker, or point brokers[].host at an address that does not answer.
      Post a valid event.
    expected_outcome: >-
      Still 202, with the same body and the same latency. The failure appears only
      in the gateway error log, and the event is gone.
    notes: >-
      THE MOST IMPORTANT CASE IN THIS PLAN, and the reason it is worth breaking a
      broker on purpose. Run it once, in front of whoever is deciding whether this
      shape is acceptable for the data in question. If the answer is no, the README
      lists the three alternatives that give the caller a real acknowledgement.

  - id: topic-autocreate-drops-first
    type: failure
    intent: >-
      Show that a topic which does not yet exist loses the message that triggers
      its creation.
    type_of_execution: manual
    procedure: >-
      Against a broker with auto.create.topics.enable=true, point kafka_topic at a
      name that does not exist yet. Post one event, then post a second.
    expected_outcome: >-
      Both return 202. The topic now exists and contains only the SECOND message.
      The first produced "not found topic ... retryable: true" in the gateway log
      and was dropped.
    notes: >-
      Create topics explicitly as part of deployment rather than relying on
      auto-creation. This failure is invisible from the caller's side and silently
      costs exactly one event per new topic — which, on a topic created in
      production by the first real event, is a real event.

coverage:
  positive: [valid-event, correlation-id, message-on-topic]
  negative: [schema-rejected, rejected-event-not-published]
  boundary: [mock-header-suppressed]
  failure:  [broker-down-still-202, topic-autocreate-drops-first]
