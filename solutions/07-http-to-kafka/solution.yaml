assumptions:
- API name is "Event Ingest API" and the ingest path is POST /events (illustrative — replace with
  yours).
- The event shape (event_id, event_type, occurred_at, payload) is illustrative; body_schema and
  the OpenAPI requestBody schema are separate documents and both must be changed together.
- A Kafka broker is reachable FROM THE GATEWAY, not merely from the operator's machine.
- The topic is created explicitly at deploy time. Auto-creation drops the message that triggers
  it.
- Losing an occasional event is acceptable for this data. If it is not, this solution is the wrong
  shape — the README lists three alternatives.
- A topic browser is available to verify the Kafka leg, which is not observable from the caller's
  side.
- An upstream is bound to the service even though the /events route never reaches it; a revision
  will not deploy without a binding.
limitations:
- AT-MOST-ONCE DELIVERY. kafka-logger publishes from the log phase, after the response has been
  flushed, so no publish outcome can ever reach the caller. A broker outage returns an identical
  202. No setting on this route changes that.
- No ordering guarantee. batch_max_size 1 makes each event its own zero-delay timer and those
  timers race, so events land out of order even on a single partition. Kafka offsets carry no
  ordering meaning here — order downstream on a timestamp inside the event.
- kafka-logger's key is a static string used verbatim with no variable resolution, so partitioning
  by a field in the event body is not possible. Without a key, records round-robin.
- The route is unauthenticated as shipped. Deliberate, and the cost of closing it (dropping request-validation)
  is documented.
- No back-pressure. The gateway accepts at HTTP speed regardless of what the broker can absorb;
  producer-buffer overflow is dropped, not signalled.
- No dead-letter path. A message that cannot be produced is a log line.
- Topic auto-creation silently costs exactly one event per new topic, and in production that is
  a real one.
- Edge validation is structural only. JSON Schema cannot check that event_id is unique or that
  occurred_at is plausible, and nothing deduplicates — event_id is carried so the CONSUMER can.
- max_req_body_bytes defaults to 512 KB; a larger body is published TRUNCATED, not rejected.
- kafka-logger is a logger being used as a producer. That works and is deliberate, but its defaults
  are chosen for logs and three of them are overridden here for exactly that reason.
- request-validation cannot share a route with hmac-auth's validate_request_body.
- Topic auto-creation dropping the first message is the one case still unverified here — it needs
  a broker with auto.create.topics.enable and a topic that does not yet exist. Create topics explicitly
  and the question does not arise.
status: READY
