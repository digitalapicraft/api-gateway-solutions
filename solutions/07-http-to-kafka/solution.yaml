problem:
  statement: Partners want to POST events to an estate whose downstream is already Kafka, but
    the service in between — authenticate, validate, produce — is three lines of logic wrapped
    in a repository, a pipeline, an image, an autoscaling policy and an on-call rotation, so it
    stays on the roadmap and integrations queue behind it.
business_need:
  summary: Open an event-ingest endpoint in a configuration change instead of a new deployable,
    removing one hop that can fail from a path that already goes through the gateway, and rejecting
    malformed events at the edge so consumers stop re-validating defensively. The trade is at-most-once
    delivery, which is acceptable for analytics, audit trails and telemetry and is not acceptable
    for payments or orders.
implementation:
  gateway_capabilities:
  - request-validation
  - mocking
  - kafka-logger
  - request-id
  custom_code_required: false
  notes: 'mocking does short-circuit the access phase, so kafka-logger''s access handler — where
    include_req_body calls read_body() — never runs. It does not matter: $request_body in log_format
    resolves correctly regardless, verified against a deployed route with request-validation removed
    AND with include_req_body false. An earlier version of this package claimed removing request-validation
    would silently empty every message; that was mechanically plausible and false, and is corrected
    throughout. request-validation is here to reject malformed events, which with _meta.filter
    also keeps them off the topic. log_format MUST use $apisix_request_id, not $request_id. $request_id
    is nginx''s own id and never equals the X-Request-Id the caller receives; the request-id plugin
    overwrites $apisix_request_id with the UUID it returns. The first version of this spec used
    $request_id, so its correlation field correlated with nothing. The route is deliberately unauthenticated
    — the smallest configuration that demonstrates the mechanism. Closing it with solution 06
    requires REMOVING request-validation, because it re-encodes the body ahead of hmac-auth''s
    digest check; validate_request_body then becomes the rewrite-phase body read instead. Three
    kafka-logger defaults are overridden because they are chosen for logging rather than producing:
    producer_type async -> sync, required_acks 1 -> -1, max_retry_count 0 -> 3. None of them changes
    the at-most-once semantics. mocking''s with_mock_header defaults to true and is set false
    — a production ingest endpoint should not advertise that its acknowledgement is mocked.'
  plugins:
  - name: kafka-logger
    scope: route
    at: POST /events
    role: Configured on this solution's routes.
  - name: mocking
    scope: route
    at: POST /events
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
  - name: request-validation
    scope: route
    at: POST /events
    role: Configured on this solution's routes.
