# Local (pre-gateway) validation — a structural review of the importable
# artifacts. It does not, and cannot, establish gateway behaviour. Nothing here
# implies a gateway accepted this configuration.

local_validation:
  solution: 08-api-key
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; verify.sh parses under bash -n
    schema:                  PASS   # helix-auth (mode/validate_auth_type/apikey.source/apikey.key), proxy-rewrite (uri), request-id — every field drawn from the live plugin schema in the target org
    required_fields:         PASS   # both protected routes carry mode, validate_auth_type and a complete apikey block with source
    references:              PASS   # nothing is shared between routes; there is no cross-route value that can drift
    plugin_ordering:         PASS   # proxy-rewrite runs in the rewrite phase, helix-auth in the access phase — phase order, not priority, decides this
    plugin_scoping:          PASS   # helix-auth is per route; request-id is API-wide. No route is left unprotected by accident
    auth_authz_dependencies: PASS   # nothing on either route reads context helix-auth has not yet produced
    request_response:        PASS   # documented 200/201/401 responses match the design; 403 is documented as an authorization outcome, not an auth one
    security:                PASS   # the spec contains no key and no secret — helix-auth validate/key-auth names the header only, and the credential lives on the app
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; all explanation is in YAML comments
    tests_match_impl:        PASS   # all seven verify.sh cases map to routes and plugins that exist in the spec; the four manual cases are flagged as such in tests/test-plan.yaml
    placeholders:            PASS   # <YOUR_GATEWAY_HOST>, <ORG_ID>, <DEVICE_API_KEY>, <APP_SECRET> — no real hosts, org ids, keys or personas

  warnings:
    - >-
      apikey with source is required in practice even though the published JSON
      schema marks it optional. A configuration without it is rejected at dry-run,
      not at import, so a package that omits it looks correct until the last step.
    - >-
      Setting secret_validation to true does not create a second factor. Per the
      plugin's own schema it accepts the credential secret as an ALTERNATIVE
      credential when the api key is absent, which widens what authenticates. It
      is deliberately absent from this spec.
    - >-
      The credential travels on every request and has no expiry. Revocation
      latency is the gateway's credential cache interval, and that interval is the
      real security control in this design. Measure it per environment.
    - >-
      There is no zero-downtime rotation of a single app's credential. Rotating in
      place invalidates the old key the moment the new one is live; two apps with
      an overlap window is the only alternative for a fleet that updates slowly.
    - >-
      apikey.source also accepts query. A key in a query string is copied into
      every access log, proxy log, referrer header and browser history the request
      passes through. The test plan asserts that a query-string key is rejected by
      this configuration.
    - >-
      A resolved key still returns 403 if the app's product does not cover this
      API. That is an authorization outcome and reads like a credential problem to
      whoever is debugging it.
    - >-
      No cors block is present, deliberately — these callers are devices rather
      than browsers. Adding a wildcard CORS policy would grant browser origins an
      access path the fleet never needs.
    - >-
      The upstream is bound on the service at import/bind time, not expressed in
      the OpenAPI paths. Nothing in this document can confirm it is reachable.

  assumptions:
    - API "Terminal API" with routes /fleet/price-list and /fleet/takings. All illustrative.
    - The key header is X-Device-Key; the name is part of the contract published to callers.
    - One app per caller, each subscribed to a product that contains this API.
    - The upstream paths (/todos/1, /posts) belong to the public sample backend and are replaced with yours.

  not_established_here:
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether helix-auth in this org exposes these exact fields.
    - Any request/response behaviour whatsoever.
    - The gateway's credential cache interval, which is this design's real revocation latency.
