# Solution 08 — API-key identity: the basic example spec.
#
# Two routes and nothing else: no plugins. Import this when you want to add the
# plugins yourself in the UI, so you see what each one does. The walkthrough is
# ../guides.md, "Build it in the UI".
#
# The same API with the plugins already in it is api-spec.yaml, next to this file.
#
# Until you add the plugins, each route is forwarded to the upstream with its
# path unchanged, and nobody is asked for a key.

openapi: 3.0.3

info:
  title: Terminal API
  version: 1.0.0
  description: >-
    The two endpoints a field terminal calls: it pulls its price list and pushes
    its takings. Add the plugins yourself to require each terminal's own API key
    and to point each route at the right upstream path.

paths:
  /fleet/price-list:
    get:
      summary: Fetch the current price list for this terminal
      responses:
        '200':
          description: The current price list
          content:
            application/json:
              schema:
                type: object

  /fleet/takings:
    post:
      summary: Submit this terminal's takings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminalId, periodEnd, grossCents]
              properties:
                terminalId: { type: string }
                periodEnd:  { type: string, format: date-time }
                grossCents: { type: integer }
      responses:
        '201':
          description: Takings accepted
          content:
            application/json:
              schema:
                type: object
