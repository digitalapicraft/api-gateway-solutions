problem:
  statement: An endpoint serving thousands of constrained callers — field devices, legacy middleware,
    a partner's scheduled job — is protected only by an unpublished URL, because those callers
    cannot run an OAuth token exchange and cannot be redeployed on the timescale an incident needs.
    The operator cannot tell which caller is which, and cannot stop one without stopping all of
    them.
business_need:
  summary: Give every caller its own credential so that identity is resolved at the edge and revocation
    becomes a control-plane action taken in seconds rather than a deployment. The credential is
    long-lived and travels on every request; that is the explicit trade, and fast per-caller revocation
    is what pays for it. Resolving the app is also the prerequisite for per-app metering and per-app
    analytics.
implementation:
  gateway_capabilities:
  - helix-auth (mode validate, validate_auth_type key-auth)
  - proxy-rewrite
  - request-id
  custom_code_required: false
  notes: 'key-auth is a validate_auth_type VALUE of helix-auth, not a standalone plugin on this
    build. `apikey` with `source` is required in practice: the published JSON schema marks it
    optional and the plugin''s own check_schema rejects the config without it at dry-run. No key
    or secret appears in the spec — the route names only the header the key arrives in, and the
    credential is provisioned on the app by the control plane. This is structurally unlike helix-auth
    generate (solution 02), whose signing_secret IS a literal in the document. secret_validation
    is deliberately absent: per the plugin''s own schema it makes the credential secret an ALTERNATIVE
    credential accepted when the key is absent, which widens what authenticates rather than requiring
    more. No cors block: the callers are devices, not browsers.'
  plugins:
  - name: helix-auth
    scope: route
    at: GET /fleet/price-list · POST /fleet/takings
    role: Configured on this solution's routes.
  - name: proxy-rewrite
    scope: route
    at: GET /fleet/price-list · POST /fleet/takings
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
