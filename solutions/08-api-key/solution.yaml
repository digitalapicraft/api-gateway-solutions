assumptions:
- API name is "Terminal API" with routes /fleet/price-list and /fleet/takings (illustrative —
  replace with yours).
- The header carrying the key is X-Device-Key. Any name works; the name is part of the contract
  you publish to callers.
- One app per caller. Fewer apps than callers trades away exactly the identity this solution exists
  to create.
- A product containing this API exists and the app is subscribed to it, otherwise a resolved key
  still yields 403.
- The upstream is bound on the service at import/bind time, not expressed in the OpenAPI paths.
limitations:
- The credential travels on every request. Anything able to observe the request — a proxy, a TLS-terminating
  middlebox, a log with headers enabled — can replay it. Fast revocation is the mitigation; it
  is not a fix.
- An API key has no expiry. There is no equivalent of token_ttl, so a credential is valid until
  somebody removes the app. Time does not clean up after you.
- This is authentication, not authorization. The key proves which app is calling and carries no
  permissions.
- Identity is the APPLICATION, never an end user. No consent and no delegation.
- Revocation latency equals the gateway's credential cache interval. Measure it in your own environment
  and publish that as the SLA rather than quoting a number.
- There is no zero-downtime rotation of a single app's credential — rotating in place invalidates
  the old key the moment the new one is live. Two apps with an overlap is the only zero-downtime
  path, which matters for fleets that update over weeks.
- apikey.source supports `query`, and using it puts the credential into every access log, proxy
  log, referrer header and browser history the request passes through. The test plan asserts a
  query-string key is rejected in this package.
- Setting secret_validation to true does not add a factor. It accepts the credential's secret
  as an alternative credential when the key is absent.
- helix-auth's exact schema varies by build. Confirm with get_plugin_config before deploying rather
  than trusting the field names in this spec.
status: READY
