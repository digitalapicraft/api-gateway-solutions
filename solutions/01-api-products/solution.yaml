assumptions:
- API name is "Posts API" and the metered paths are /posts* (illustrative — replace with yours).
- Measured upstream ceiling is ~3,000 req/min (illustrative — replace with yours, and check it
  against the SUM of the quotas you have actually sold).
- Tier limits (Free 60, Pro 1000, Enterprise 10000, Internal -1 per minute) are illustrative defaults.
  Free must be unusable for production or nobody upgrades; Enterprise must match a contractual
  number rather than being scaled from Pro.
- A per-minute window is assumed. It ABSORBS bursts; a per-second window SHAPES them. Requests-per-day
  windows are the worst of both.
- The route has a service_id. Without one the enforcer returns 403 regardless of subscription,
  and nothing in the plugin config hints at it.
- Static API keys are the identity mechanism. For proof of possession, compose with solution 02
  (client-credentials JWTs) and keep the enforcer behind the auth block.
- The gateway is assumed single-node unless quota_policy is set to redis in plugin_attr. On more
  than one node, redis is mandatory.
limitations:
- api-product-enforcer emits no X-RateLimit-* headers and no Retry-After. A client cannot read
  its remaining quota from a response. The retry contract must live in developer docs and must
  specify backoff WITH JITTER — without jitter every client retries at the same instant at the
  top of each window, which is a scheduled thundering herd. Remaining quota comes from the portal/analytics,
  not headers.
- One product is evaluated per request (the top-ranked one covering the route). There is no fallback
  into a second subscribed product when the first is spent.
- Quota is per app (the credential) by default. Two keys on the same app share one bucket, which
  is the most common false alarm when testing isolation.
- Multi-node correctness depends on quota_policy being set to redis in plugin_attr, which is invisible
  from this route config. Default `local` counts per node.
- The quota is a request COUNT, not a cost. A cheap read and a 30-second report each consume one
  unit. Split into per-endpoint-group products if cost varies widely.
- Not burst shaping. A caller can spend a full window's budget in the first seconds of it unless
  the window is short.
- No per-end-user metering. The unit is the app; the platform has no notion of your application's
  users.
- error_policy is a commercial decision disguised as a config field. fail_close (default) returns
  503 during a quota-backend outage, protecting metering accuracy at the cost of availability.
  fail_open serves unmetered traffic you cannot account for, and you may not notice it happened.
- A product with no quota object returns 403, NOT unlimited. Unlimited is limit: -1.0
- It does not prevent overselling. It makes overselling visible as 429s rather than as an outage,
  which is a better failure but still a failure.
status: READY
