# Gateway validation — this solution was imported, dry-run, deployed against a real
# SOAP backend, and exercised end to end. The statuses below are for the
# configuration in gateway/api-spec.yaml. Re-run gateway/verify.sh against your own
# environment before you rely on it.

gateway_validation:
  solution: 02-soap-to-rest
  version: 1.0.0

  dry_run:
    status: PASS

  deployment:
    status: DEPLOYED
    detail: >-
      Deployed ACTIVE against a SOAP backend. Applying a corrected transform to an
      already-live API exercises the revision lifecycle: an ACTIVE revision rejects
      edits (HTTP 409), so clone or undeploy first, then deploy.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: >-
      verify.sh exits 0. The request JSON is converted to XML for the handler and
      the response XML is converted back to JSON — case 4 asserts the response body
      contains no XML markup, proving the full round-trip rather than a relabelled
      content type.
    cases:
      - { id: unauthenticated,           expected_status: 401, result: PASS }
      - { id: token-issue,               expected_status: 200, result: PASS }
      - { id: valid-call-transformed,    expected_status: 200, result: PASS, note: "content-type application/json" }
      - { id: response-really-converted, expected_status: 200, result: PASS, note: "body contains no XML markup" }
      - { id: invalid-token,             expected_status: 401, result: PASS }

  agent_prompt_run:
    executor: harness/verify-agent.sh (hosted agent, default model)
    date: 2026-09-21
    status: PASS
    detail: >-
      One route with proxy-rewrite, request-id and xml-to-json. Both documented
      traps avoided unprompted: transform_request true, and no Content-Type
      forced in proxy-rewrite.
    verified_by: >-
      get_revision read back after the run; the stored routeSpec was inspected
      directly, not inferred from the agent transcript.

  overall: READY
