assumptions:
  - The caller's identity arrives in x-partner-id. Illustrative — in a real
    deployment derive it from an authenticated credential rather than trusting a
    header the caller sets.
  - Paths are /sandbox/partners, /sandbox/profile and /sandbox/diagnostics.
    Illustrative; any paths work.
  - Values are stored with a 86400s TTL. A deliberate choice, not a platform
    default — pick it for how often your partners' data changes.
  - Partner ids contain no colon, which is the separator used in the key template.
  - The key-value store is provisioned on the target environment; it is
    infrastructure this spec consumes rather than creates.
  - The upstream binding exists so the revision can deploy. It is never contacted.

limitations:
  - The registration route ships UNAUTHENTICATED. Anyone who can reach it can
    rewrite any partner's sandbox values. Protecting it is part of adopting this
    package, not a later refinement.
  - A store miss and a stored empty string are indistinguishable — both render as
    "". Store a sentinel if you need to tell them apart.
  - fail_action close governs store ERRORS, not misses. Nothing here fails closed
    on an unknown partner; an unregistered caller gets a 200 with empty values.
  - The registration route's 202 acknowledges that the insert was configured, not
    that a value was written. Read it back to confirm a write.
  - mocking SHORT-CIRCUITS, so this pattern can never hand a stored value to a
    real backend. For that you need pgp-crypto or lua-callout — see solution 12.
  - A $ctx path segment cannot contain a hyphen. A hyphen silently ends the
    reference and the remainder passes through as a literal, so a key named
    partner-tier can be stored but never referenced. Underscores only.
  - $request.headers.<name> is key-value-map's grammar and does NOT resolve inside
    mocking. Use $ctx.<path> or an ordinary gateway variable such as
    $http_x_partner_id.
  - A ctx reference to a table expands to a JSON object, so it must not sit inside
    quotes in a JSON body. Quoting it yields invalid JSON with a 200 and no error.
  - This is a sandbox pattern. It has no schema validation, no persistence
    guarantees beyond the TTL, and no audit trail of who changed a value.
  - Every value is visible to anyone who can call the read route with the right
    partner id, which is a header. Do not store anything confidential.

status: READY   # validated on a gateway; verify.sh passes 6/6
