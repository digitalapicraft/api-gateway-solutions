# Solution manifest — the traceability spine for this package.
# Every artifact below corresponds to this one solution version. If the gateway
# config changes, bump `version` and re-derive the docs and diagrams from it
# — never the other way round.

solution:
  name: A sandbox that answers every partner with that partner's own values
  slug: 14-dynamic-mock
  version: 1.0.0
  category:
    - Developer Experience
    - Mediation & Mocking
  tags: [mocking, key-value-map, sandbox, per-caller, ctx, no-backend, dynamic-mock]

problem:
  statement: >-
    Integration teams need a sandbox that answers each partner with that partner's
    own values, because a single canned response lets partner-specific integration
    bugs through to production, without standing up and operating a service behind
    the endpoint or shipping a release every time a partner's data changes.

business_need:
  summary: >-
    Turn sandbox data into data. Onboarding a partner becomes a request rather
    than a release, correcting a value takes seconds rather than a deploy cycle,
    and the endpoint has no service behind it to run, patch or page anyone about.
    The integration bugs that used to surface in production surface in the
    sandbox, because the sandbox finally differs per partner.

implementation:
  gateway_capabilities:
    - key-value-map (inserts)      # administrative route — stores per-partner values under a key built from the caller's id
    - key-value-map (fetch+alias)  # read route — resolves the caller's own values, alias makes a dynamic key referenceable
    - mocking                      # reads ctx.helix.key_value_map and answers; short-circuits, so no upstream is contacted
    - request-id                   # correlation for "my sandbox says bronze" reports
    - cors                         # browser-based partner tooling
  custom_code_required: false
  notes: >-
    This package exists because a claim in solution 12 was wrong. That package
    states pgp-crypto is the only way to observe a key-value-map value on a
    free-trial org. It is not: mocking reads ctx.helix.key_value_map directly.
    The distinction that survives, and the reason 12 keeps pgp-crypto, is that
    mocking SHORT-CIRCUITS — it can show a stored value but never hand one to an
    upstream. Observing and using are different jobs with different consumer sets.

    Two things make this work and both are counter-intuitive. There are TWO
    substitution grammars: ${ctx.helix.<ns>.<field>} looks the whole dotted string
    up as one variable NAME in a flat table that only service-callout writes to,
    and returns empty here; $ctx.<dotted.path> walks the real request context and
    reaches the store. On this build only mocking resolves the second form. And
    alias RENAMES the published field, which is the only way to reference a value
    fetched under a dynamic key — without it the field is named after whatever the
    caller sent.

