assumptions:
- API name is "Support Console API" with routes /support/customers and /support/customers/{customerId}
  (illustrative).
- The sensitive fields are named email, phone, lat and lng in the serialised response body.
- The email domain is worth keeping and the local part is not. Decide this per field for your
  own data.
- A logger plugin is added separately where the log half is required; the spec carries the mask,
  not the logger.
- The package ships unauthenticated on purpose so masking is the only behaviour under test.
limitations:
- 'response-rewrite''s scope defaults to `once`. A filter without scope: global masks the first
  match and leaves every other one — one record of a list, and it is the first one, which is the
  record that appears in every screenshot.'
- The filters are regex substitutions over body text, not schema-aware redaction. The same value
  under a different key, inside a base64 or URL-encoded string, or quoted in a free-text error
  message is NOT masked.
- An over-broad pattern corrupts data silently. Every filter must be anchored on its own field
  name, and a test must assert that unfiltered fields are untouched.
- log-data-mask has NO effect on a route that carries no logger plugin, and none on analytics,
  which does not pass through the shared log helper.
- log-data-mask does not change the response. A route carrying only that plugin sends the caller
  everything.
- Masking is not access control. A caller who should not see the record at all must be stopped
  by identity.
- The masked value is not reversible and not format-preserving. There is no token a downstream
  system can correlate on.
- The upstream still returns the sensitive data, and the gateway holds it in memory to rewrite
  it. If the requirement is that the value never leaves the system of record, this control does
  not meet it.
- Body rewriting buffers the response, which costs memory on large payloads.
- If a format converter runs on the same route it runs FIRST, so the patterns must match the converted
  body rather than the upstream's original.
status: READY
