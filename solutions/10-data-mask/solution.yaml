  slug: 10-data-mask
  title: Mask the values, not just the log line
  summary: A customer API returns the whole record to every consumer. Support agents read full
    email addresses, phone numbers and home coordinates they have no need for, and the same payload
    is copied into a log aggregator with longer retention and a wider audience — which is where
    an audit
  version: 1.1.0
  released: '2026-09-21'
  updated: '2026-09-25'
  category: Observability
  categories:
  - Observability
