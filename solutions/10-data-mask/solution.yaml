problem:
  statement: A customer API returns the whole record to every consumer. Support agents read full
    email addresses, phone numbers and home coordinates they have no need for, and the same payload
    is copied into a log aggregator with longer retention and a wider audience — which is where
    an audit finding named it. Narrowing the response at the backend is a schema change on a shared
    service and is not schedulable.
business_need:
  summary: Narrow the response at the single point every consumer passes through, so the screen
    stops carrying what nobody needs and the logged copy is redacted independently. Keep the useful
    half of each field — the email domain, not the local part — because a control that makes the
    job harder is a control that gets an exception and then a rollback.
implementation:
  gateway_capabilities:
  - response-rewrite (filters)
  - log-data-mask
  - proxy-rewrite (uri, regex_uri)
  - request-id
  custom_code_required: false
  notes: 'The two masks are independent controls with independent evidence. Verified on two routes
    differing only in this: a route carrying ONLY log-data-mask returned the caller the full email
    and phone, while its log entry carried the mask and no Authorization header. Neither plugin
    implies the other, and log-data-mask has no effect at all on a route with no logger plugin,
    nor on analytics. response-rewrite''s `scope` defaults to `once`, which masks the FIRST match
    in the body and leaves the rest. Reproduced deliberately: 1 of 10 records masked. Every filter
    in this spec sets scope: global. The filters are regex substitutions over the serialised body,
    anchored on their own field names. They cannot see a value under another key or inside an
    encoded string, and an unanchored pattern corrupts data silently.'
  plugins:
  - name: log-data-mask
    scope: route
    at: GET /support/customers · GET /support/customers/{customerId}
    role: Configured on this solution's routes.
  - name: proxy-rewrite
    scope: route
    at: GET /support/customers · GET /support/customers/{customerId}
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
  - name: response-rewrite
    scope: route
    at: GET /support/customers · GET /support/customers/{customerId}
    role: Configured on this solution's routes.
