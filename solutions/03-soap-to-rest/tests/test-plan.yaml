# Test plan — SOAP/XML backend served as REST/JSON.
#
# The first two cases are executed by ../example/verify.sh, which exits 0 only if
# both hold. The fixtures under requests/ and expected/ document each case
# independently so you can run one by hand.
#
# Substitute your own values:
#   {{GATEWAY}}        gateway base URL, e.g. https://<YOUR_GATEWAY_HOST>
#
# This API carries no authentication — that is solution 02, and composing the two
# is a variation in the README. No case here sends a credential.

meta:
  solution: 03-soap-to-rest
  version: 1.1.0
  executor: example/verify.sh
  note: >-
    The first two cases are automated. The XML-semantics cases (single vs multiple elements,
    namespaces, attributes) are manual because they need a handler that can be made
    to return each shape, and they are the cases most likely to surprise a partner
    in production.

cases:

  - id: valid-call-transformed
    type: positive
    intent: >-
      The JSON request body is converted to XML, the
      handler is called on its real path, and its XML response comes back as JSON.
    request: requests/valid-locations.http
    expected: expected/locations-200.json
    response_notes: >-
      ILLUSTRATIVE SHAPE ONLY — do not assert this structure. The JSON is a
      mechanical projection of whatever XML your handler returned, so the keys will
      be YOUR element names, including PascalCase and any vendor prefixes. What you
      SHOULD assert: content-type is application/json, the body parses, and the body
      contains no XML markup. The last one is the real test — a content-type header
      is a claim, a body with no angle brackets is evidence. If the handler returns
      exactly ONE <Site>, this may be an object rather than a one-element array. XML
      cannot distinguish an item from a list of one. Test both shapes and publish
      both — see tests/test-plan.yaml case single-vs-multiple-elements.
      application/json
    expected_status: 200
    assertions:
      - response content-type is application/json
      - the body parses as JSON
    notes: >-
      A 500 here from a handler that works under curl is almost never the handler.
      Suspect, in order: a second transform plugin converting the body twice; a
      missing SOAPAction header; request field names that don't match the elements
      the handler reads.

  - id: response-really-converted
    type: positive
    intent: >-
      THE CASE THAT MATTERS. The response body contains no XML markup. A
      content-type header is a claim the gateway makes; a body with no angle
      brackets is evidence the transform actually ran.
    request: requests/valid-locations.http
    expected: expected/locations-200.json
    expected_status: 200
    assertions:
      - the response body matches no XML-open-tag pattern (no `<` followed by a name, `/` or `?`)
    notes: >-
      Relabelling unconverted XML as application/json is a real and easy
      misconfiguration, and it passes any check that only inspects headers. The
      partner's parser is what discovers the truth, with an error message pointing
      nowhere near your gateway. Never assert the header alone.

  - id: empty-result-envelope
    type: boundary
    intent: >-
      When the handler returns an empty envelope, the client gets valid but empty
      JSON rather than an error. Distinguishes "no results" from "the transform
      broke", which look similar from a client.
    request: requests/valid-locations.http
    expected: expected/locations-empty-200.json
    response_notes: >-
      A legitimate no-results response. The point of this case is to distinguish 'no
      data' from 'the transform broke' — both can look like an empty body from a
      client. On this build an empty collection converts to null, not {}. Valid,
      parseable JSON with null in place of the collection is the correct outcome,
      not an error. An empty result is MORE often a request whose field names didn't match the
      elements the handler reads than a genuinely empty dataset. verify.sh warns
      rather than fails here for exactly that reason. Check what XML your JSON is
      producing before concluding there's no data. application/json
    expected_status: 200
    type_of_execution: manual
    procedure: Send a query that legitimately matches nothing (e.g. a nonexistent region code).
    notes: >-
      verify.sh warns rather than fails when the JSON carries no values (null or
      empty), because an empty result
      is usually a request whose field names didn't match the elements the handler
      reads — not a broken transform.

  - id: single-vs-multiple-elements
    type: boundary
    intent: >-
      Establish what your transform does when a collection has exactly ONE member
      versus several. XML cannot distinguish an item from a list of one, so one
      element may become an object where two become an array.
    type_of_execution: manual
    procedure: >-
      1) Query so the handler returns exactly one <Site>. Record the JSON shape.
      2) Query so it returns several. Record the JSON shape.
      3) Compare: is the single case an object or a one-element array?
    expected_outcome: >-
      Both shapes documented, and BOTH published in your developer documentation.
    notes: >-
      Run this before you onboard anyone. Partner code written against a
      multi-result example breaks on the single-result case — the edge case,
      discovered in production, on their side. This is the highest-value manual
      case in the plan.

  - id: namespaced-and-attribute-payload
    type: boundary
    intent: >-
      Establish how namespaces and XML attributes survive the transform, since
      default settings often flatten prefixes or drop attributes entirely.
    type_of_execution: manual
    procedure: >-
      Call an operation whose response carries namespace prefixes and elements with
      attributes. Inspect the JSON: are prefixes preserved, stripped or mangled? Do
      attributes appear as fields, or vanish?
    expected_outcome: >-
      On the tested build, prefixes are kept (soap:, m:) and xmlns:* attributes come
      back as JSON fields. Publish this, because it becomes part of what partners see.
    notes: >-
      The request side declares its namespaces through xml-to-json's
      root_attributes. Field order is not kept: a JSON object with several fields
      is sent as XML with its fields sorted alphabetically, which can break a
      service whose WSDL uses xs:sequence. JSON field order in responses is not
      stable between calls either.

  - id: double-transform-misconfiguration
    type: failure
    intent: >-
      Establish the symptom of the most common misconfiguration so it's
      recognisable: adding json-to-xml alongside the bidirectional xml-to-json.
    type_of_execution: manual
    expected_status: 200
    procedure: >-
      In a THROWAWAY test environment only, add a json-to-xml plugin next to
      xml-to-json and call the route.
    notes: >-
      Exercise in a controlled environment only. On the tested build this returns
      200 with JSON, not a 500, and callers that ask for XML wrongly get JSON too.
      So the symptom is XML clients receiving JSON, from a config that looks MORE
      thorough rather than less. Treat it as a known behaviour of this build.

  - id: upstream-failure
    type: failure
    intent: >-
      When the SOAP handler is unreachable or errors, the gateway surfaces a 5xx
      rather than a malformed 200.
    request: requests/valid-locations.http
    expected: expected/upstream-502.json
    response_notes: >-
      The SOAP handler was unreachable or errored. The important property is that
      the gateway surfaces a 5xx rather than a malformed 200 — a partner must never
      receive a success status carrying a failure. Assert the status class, not the
      body; the exact payload is build-dependent. The 502 error page is HTML, even
      for a client that sent Accept: application/json. 504: The handler was reached but
      answered too slowly. Legacy handlers built for batch use often do — check the
      route timeout before concluding the upstream is down. 415: The handler
      rejected the content type: xml-to-json sends application/xml, and a SOAP 1.1
      service needs text/xml. Set it in proxy-rewrite with _meta.priority below 997;
      SOAP 1.2 handlers want application/soap+xml. 500: The handler errored. Suspect
      a missing SOAPAction header, or request field names that don't match the
      elements it reads.
    expected_status: 502
    type_of_execution: manual
    optional: true
    procedure: Point the upstream at an unreachable host, or stop the handler. Controlled environments only.

  - id: content-type-priority
    type: failure
    intent: >-
      Prove the Content-Type fix depends on proxy-rewrite running after
      xml-to-json. At its own priority (1008) proxy-rewrite relabels the JSON body
      before the conversion; at 900 it runs after it.
    type_of_execution: manual
    expected_status: 200
    procedure: >-
      In a THROWAWAY test environment, against a SOAP 1.1 service: 1) remove
      _meta.priority from proxy-rewrite (default priority) and call the route —
      expect 500, with the body sent to the service unconverted. 2) set
      _meta.priority back to 900 and call again — expect 200 with JSON.
    notes: >-
      Use a trace (the API's Observability tab, Start trace session) to see the body and
      headers at each step.

  - id: slow-handler-timeout
    type: failure
    intent: >-
      Establish what happens when the handler is slower than the gateway timeout,
      because legacy SOAP systems built for batch use often are.
    type_of_execution: manual
    expected_status: 504
    procedure: Call an operation known to take longer than the route's timeout.
    notes: >-
      A 504 here looks like an outage and isn't. Knowing your handler's real p99
      before go-live is worth more than the test itself.

coverage:
  positive: [valid-call-transformed, response-really-converted]
  negative: [upstream-failure]
  boundary: [empty-result-envelope, single-vs-multiple-elements, namespaced-and-attribute-payload]
  failure:  [double-transform-misconfiguration, upstream-failure, content-type-priority, slow-handler-timeout]
