problem:
  statement: API teams need to open a SOAP/XML system of record to partners who require REST/JSON
    because every integration otherwise becomes an adapter service or a rewrite, without modifying
    a backend that is correct, stable and unsafe to touch.
business_need:
  summary: Stop the count of services you operate growing with the count of partners you onboard.
    Integration lead time drops from an adapter project to a configuration change, the system
    of record leaves the critical path for commercial decisions, and the pressure to rewrite it
    becomes a technical decision on your own timetable rather than a commercial emergency.
implementation:
  gateway_capabilities:
  - xml-to-json (transform_request + transform_response)
  - proxy-rewrite
  - helix-auth (mode generate)
  - helix-auth (mode validate, jwt-auth)
  - request-id
  - cors
  custom_code_required: false
  notes: 'How this build behaves (the three things that must be set correctly): (1) transform_request
    DEFAULTS TO false, so an empty xml-to-json block converts the response only; it must be set
    true. (2) The response transform is content-negotiated — it fires only when the client sends
    Accept: application/json. (3) proxy-rewrite (prio 1008) setting Content-Type: text/xml runs
    BEFORE xml-to-json (997) and hides the JSON body from the request transform, so proxy-rewrite
    must retarget the path ONLY. json-to-xml is NOT the request-side counterpart — it is a separate
    plugin converting a JSON upstream response to XML for XML-wanting clients. Confirm fields
    with get_plugin_config. Authentication runs before the transform, deliberately: no point converting
    a body about to be discarded.'
  plugins:
  - name: cors
    scope: document
    role: Configured on this solution's routes.
  - name: helix-auth
    scope: route
    at: POST /oauth/token · POST /locations
    role: Configured on this solution's routes.
  - name: proxy-rewrite
    scope: route
    at: POST /locations
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
  - name: xml-to-json
    scope: route
    at: POST /locations
    role: Configured on this solution's routes.
