solution:
  name: Serve a SOAP backend as REST/JSON
  slug: 03-soap-to-rest
  title: Serve a SOAP backend as REST/JSON
  summary: API teams need to open a SOAP/XML system of record to partners who require REST/JSON
    because every integration otherwise becomes an adapter service or a rewrite, without modifying
    a backend that is correct, stable and unsafe to touch.
  version: 1.1.0
  released: '2026-08-18'
  updated: '2026-09-25'
  category: Mediation & Modernization
  categories:
  - Mediation & Modernization
  tags:
  - soap
  - xml
  - json
  - protocol-mediation
  - legacy-modernization
  - xml-to-json
  - proxy-rewrite
facts:
  setup_time: ~25 minutes
  difficulty: Intermediate
  needs:
  - Your own SOAP endpoint reachable from the gateway (this is a SOAP use case — a REST placeholder
    like jsonplaceholder can't stand in) and its handler path
  - a real signing-secret value (literal — see solution 02)
  - one developer + app
  - '`xml-to-json` in your org'
  - a test environment
  plugins:
  - cors
  - helix-auth
  - proxy-rewrite
  - request-id
  - xml-to-json
  build_with:
