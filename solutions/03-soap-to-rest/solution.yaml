answers: what-shape-is-the-payload
validation:
  local: PASS
  gateway_dry_run: PASS
  deployment: DEPLOYED
  functional_test: PASS
  record: validation/
assumptions:
- API name "Partner Locations API"; mediated route POST /locations; SOAP handler path <SOAP_HANDLER_PATH>.
  All illustrative — replace with yours.
- The handler expects content-type text/xml (SOAP 1.1 style). SOAP 1.2 handlers want application/soap+xml.
- The handler does NOT require a SOAPAction header. Many classic SOAP 1.1 and .asmx endpoints
  DO; add it in proxy-rewrite.headers.set if yours is one of them.
- The request body's field names match the element names the handler reads.
- Authentication is wanted. Remove the helix-auth blocks if this API is internal-only.
- token_ttl 900 is a deliberate choice, not a platform default. See solution 02.
- The signing secret is a LITERAL value filled into the spec (this build does not resolve <ENV:...>).
  Replace <YOUR_JWT_SIGNING_SECRET> and keep it out of git.
- The upstream is bound on the service at import/bind time, not in the OpenAPI paths.
limitations:
- The JSON shape is DERIVED from the XML, not designed. Element names, casing and vendor prefixes
  come through as-is, and once partners integrate against them they are part of your public contract
  — renaming is then a breaking change.
- XML has no concept of an array. A collection with one member may transform to an object where
  two members transform to a list. Partner code written against a multi-result example breaks
  on the single-result case. Publish BOTH example shapes.
- Namespaces and attributes need explicit configuration and may be flattened or dropped by default.
- Body translation only. WS-Security, SOAP headers, attachments and MTOM are not addressed.
- No validation of the transformed request. A partner can send JSON that converts to XML the handler
  rejects; the error surfaces as a 500 from the handler rather than a 400 from the gateway. Add
  request-validation for a clean edge rejection.
- One inbound call maps to exactly one backend call. Fanning out to several SOAP operations, or
  merging results, is composition — a different pattern.
- Mediation does not make a slow handler fast. If the SOAP system takes eight seconds, so does
  the mediated API; check the gateway timeout before concluding the upstream is down, because
  the symptom is a 504 that looks like an outage.
- Two conversions per request add latency. Small, but not zero, and it grows with payload size.
- A transform that silently fails to run on the response yields a 200 with an XML body and a JSON
  content-type — success-shaped failure, discovered by the partner's parser. verify.sh case 4
  asserts the body has no XML markup — it passes for the corrected config.
- xml-to-json's schema varies by build. Confirm with get_plugin_config rather than trusting the
  field names in this spec.
status: READY
