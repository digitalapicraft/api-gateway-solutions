# Solution 03 — Expose a SOAP/XML backend as a REST/JSON API.
#
# This is the importable artifact: an OpenAPI 3.0.3 document carrying
# x-helix-gateway.plugins. Import it (OpenAPI import, or paste the agent prompt
# into Agent Mode), bind your SOAP upstream, then deploy the revision.
#
# WHAT THIS DOES
#   A partner sends JSON to POST /locations. The gateway converts that body to
#   XML, retargets the path to the SOAP handler, and converts the XML response
#   back to JSON on the way out. The SOAP service is not modified and does not
#   know a REST client exists.
#
#   THERE IS NO AUTHENTICATION HERE, deliberately. This package is the protocol
#   mediation and nothing else. A mediated legacy API is almost always also a
#   newly-exposed one, so put identity in front of it before partners call it —
#   that is solution 02, and composing the two is a documented variation in the
#   README. Until you do, this route is open to anyone who can reach it.
#
# THE TRANSFORM IS ONE PLUGIN, BUT NEITHER DIRECTION IS ON BY DEFAULT AS YOU
# MIGHT ASSUME. On this build:
#   - transform_request DEFAULTS TO false. An empty `xml-to-json: {}` does NOT
#     convert the request body — the client's JSON reaches the SOAP handler as
#     JSON. You MUST set transform_request: true (done below).
#   - transform_response defaults to true but is CONTENT-NEGOTIATED: it only
#     fires when the client sends `Accept: application/json`. Tell integrators.
#   You do NOT add json-to-xml. That is a SEPARATE plugin solving the OPPOSITE
#   problem (JSON upstream response -> XML for XML-wanting clients), not the
#   request-side counterpart. Adding it would not help and could double-convert.
#
# EXECUTION IS PRIORITY/PHASE-ORDERED, NOT DOCUMENT-ORDERED (verified priorities
# on this build). On /locations:
#   proxy-rewrite (prio 1008)         rewrite phase — retarget the upstream path
#                                     ONLY. Do NOT set Content-Type here: it runs
#                                     BEFORE xml-to-json (997) and would hide the
#                                     JSON body from the request transform.
#   xml-to-json (prio 997)            request + response conversion
#
# The ordering that matters: proxy-rewrite runs BEFORE xml-to-json, which is why
# the Content-Type warning below is the trap on this route. When you add identity
# (solution 02) it lands in the access phase, ahead of both — so an unauthenticated
# request costs no transform work.
#
# PLUGIN SCHEMA NOTE
#   xml-to-json's fields vary by build; confirm with get_plugin_config in YOUR
#   org. On the verified build the useful ones are: transform_request (default
#   false), transform_response (default true), content_types (which upstream
#   types to convert), request_content_types (which request bodies to convert),
#   property_naming (camelCase|PascalCase), array_item_name, max_body_size.
#
# UPSTREAM is bound on the service at import/bind time, NOT in the OpenAPI
# paths. Replace <SOAP_UPSTREAM_URL> wherever your control plane asks for it.
#

openapi: 3.0.3

info:
  title: Partner Locations API
  version: 1.0.0
  description: >-
    Partner-facing location lookup. A SOAP/XML system of record is exposed as a
    REST/JSON endpoint at the edge: the gateway converts the request body to XML,
    calls the SOAP handler, and converts the response back to JSON. The backend
    service is unchanged. This API carries no authentication of its own — see
    solution 02 to put identity in front of it.

paths:
  /locations:
    post:
      summary: Look up partner locations (JSON in, JSON out)
      description: >-
        Accepts a JSON body, proxies to the SOAP handler at
        `<SOAP_HANDLER_PATH>` as XML, and returns the upstream's XML response
        transformed to JSON.

        A partner integrating against this endpoint never sees XML, never
        constructs a SOAP envelope, and does not need the WSDL.
      requestBody:
        required: false
        description: >-
          Query fields for the location lookup, as JSON. The gateway converts
          this object to the XML the SOAP handler expects — the field names must
          match the elements that handler reads.
        content:
          application/json:
            schema:
              type: object
              properties:
                region:      { type: string, description: Region code to filter by }
                activeOnly:  { type: boolean, description: Exclude decommissioned sites }
      responses:
        '200':
          description: >-
            Locations, as JSON transformed from the upstream XML. `content-type:
            application/json` on this response is the proof the transform ran.
          content:
            application/json:
              schema:
                type: object
        '502': { description: The SOAP backend was unreachable or returned an error }
        '504': { description: The SOAP backend did not respond in time }
      x-helix-gateway:
        plugins:
          # 1. Retarget the upstream path. The client called /locations; the
          #    handler only answers on <SOAP_HANDLER_PATH>.
          #
          #    DO NOT set Content-Type here. It is tempting — the SOAP handler
          #    wants text/xml — and it BREAKS the request transform. proxy-rewrite
          #    runs at priority 1008, xml-to-json at 997, so proxy-rewrite goes
          #    FIRST: it would rewrite the content type to text/xml before
          #    xml-to-json inspects it, the body would no longer match
          #    request_content_types (default application/json), and the request
          #    direction would silently never fire. On this build (verified), 
          #    gateway. Let the transform own the content type.
          #
          #    If your SOAP service requires a SOAPAction header, add it here —
          #    many .asmx and classic SOAP 1.1 endpoints return a 500 with an
          #    unhelpful envelope without one. That header is safe to set; the
          #    content type is not.
          proxy-rewrite:
            uri: <SOAP_HANDLER_PATH>

          # 2. The bidirectional transform. ONE plugin, BOTH directions — but
          #    NEITHER direction is on by default in the way you would assume:
          #
          #      transform_request  DEFAULTS TO false. An empty `xml-to-json: {}`
          #                         block does NOT convert the request body. The
          #                         client's JSON would reach the SOAP handler as
          #                         JSON on this build.
          #
          #      transform_response defaults to true, but is CONTENT-NEGOTIATED:
          #                         it only fires when the client sends
          #                         `Accept: application/json`. Without that
          #                         header the upstream XML passes straight
          #                         through as text/xml. Tell your integrators.
          #
          #    Do NOT add json-to-xml alongside this. That plugin is not the
          #    request-side counterpart — it converts a JSON *upstream* response
          #    to XML for clients that ask for XML. It solves the opposite
          #    problem and has no place here.
          #
          #    Other fields worth knowing (confirm with get_plugin_config):
          #      content_types          which upstream types to convert
          #                             (default application/xml, text/xml)
          #      request_content_types  which request bodies to convert
          #                             (default application/json)
          #      property_naming        camelCase | PascalCase
          #      array_item_name        element name for array items (default item)
          #      max_body_size          default 1048576
          xml-to-json:
            transform_request: true
            transform_response: true

# API-WIDE POLICY.
#
# Note what is NOT here: no identity plugin — see the header. And no analytics
# plugin, because analytics is enabled globally on the platform and every call
# through this API is already captured. See solution 04.
x-helix-gateway:
  plugins:
    # Correlation id, stamped on every call. Worth more here than on a plain
    # REST API: when a partner reports a bad response you need to correlate the
    # JSON they saw with the XML the handler actually returned, across the
    # gateway->SOAP hop.
    request-id:
      algorithm: uuid
      header_name: X-Request-Id

    cors:
      allow_origins: "*"
      allow_methods: "POST,OPTIONS"
      allow_headers: "content-type"
      allow_credential: false
