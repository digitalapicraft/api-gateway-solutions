# Local (pre-gateway) validation — a structural review of the importable
# artifacts, plus the parts of verify.sh that can honestly be exercised without a
# gateway. It does not, and cannot, establish gateway behaviour.

local_validation:
  solution: 03-api-products
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; products.json is valid JSON; verify.sh parses under bash
    schema:                  PASS   # helix-auth, api-product-enforcer (error_policy only), request-id, cors, limit-count — all fields drawn from confirmed usage, none invented
    enforcer_fields:         PASS   # api-product-enforcer carries error_policy and nothing else. No policy/redis_host on the route, which the plugin does not accept.
    required_fields:         PASS   # every product in products.json carries a quota object; the unlimited tier uses limit -1 rather than omitting quota
    references:              PASS   # products reference <API_ID>; limit-count references <ENV:REDIS_HOST>
    plugin_ordering:         PASS   # helix-auth (identity + subscriptions) -> product resolution -> api-product-enforcer. The enforcer can only work because helix-auth ran first.
    plugin_scoping:          PASS   # helix-auth, api-product-enforcer, request-id and cors are API-wide; limit-count is route-scoped to POST /orders/search only
    auth_authz_dependencies: PASS   # nothing reads context helix-auth has not yet produced; the per-IP limiter is deliberately independent of identity
    request_response:        PASS   # documented 401/403/429/503 responses match the design, and are distinguished from each other
    security:                PASS   # no literal secrets; app keys/secrets are provisioned on the credential by the control plane; REDIS_HOST is an <ENV:...> reference
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; all explanation is in YAML comments
    tests_match_impl:        PASS   # the five verify.sh cases map to routes and plugins present in the spec; the seven manual cases are flagged as such in tests/test-plan.yaml
    placeholders:            PASS   # <YOUR_GATEWAY_HOST>, <ORG_ID>, <ENV_ID>, <API_ID>, <PRODUCT_ID>, <ENV:REDIS_HOST> — no real hosts, org ids or personas
    quota_arithmetic:        PASS_WITH_NOTE   # see warnings — the illustrative tier sum exceeds the illustrative upstream ceiling, deliberately, and products.json says so

  executed_locally:
    # The only things in this package that were actually RUN. Recorded separately
    # from the structural review so the two are not confused.
    - description: verify.sh parsed with `bash -n`
      result: PASS
    - description: >-
        verify.sh run with no environment variables set — confirms the required-variable
        guards fire with usable guidance and a non-zero exit rather than proceeding
      result: PASS
    - description: >-
        verify.sh run with FREE_KEY equal to PRO_KEY — confirms the same-app guard
        rejects before any network call, since two keys on one app share a quota bucket
        and would make correct isolation look broken
      result: PASS
    - description: >-
        verify.sh run against an unreachable host — confirms it reports "could not reach
        the gateway" rather than misattributing a connection failure to a missing plugin
      result: PASS
    - description: products.json parsed as JSON, and every product confirmed to carry a quota object
      result: PASS

  executed_locally_note: >-
    These establish that the SCRIPT behaves. They establish nothing about the
    gateway. No case in tests/test-plan.yaml has been executed.

  warnings:
    - >-
      QUOTA ARITHMETIC: the illustrative tiers sum to 11,060 req/min (Free 60 + Pro
      1000 + Enterprise 10000, Internal unmetered) against an illustrative upstream
      ceiling of 3,000 req/min. That is deliberate in a sample, and it is exactly the
      check to run for real: add up the quotas across the tiers you have ACTUALLY sold
      and compare with what your upstream can take. If the sum exceeds capacity you have
      oversold, and the quota will surface that as 429s to customers rather than as an
      outage — a better failure, but still a failure.
    - >-
      The quota BACKEND is not in this spec and cannot be validated from it.
      quota_policy (local vs redis) lives in plugin_attr.api-product-enforcer in the
      gateway's config.yaml. On more than one node it MUST be redis; the default `local`
      counts in each node's own memory, so an N-node cluster serves roughly N times the
      quota you sold. This is the most common way the solution fails to deliver its
      promise and it is invisible from the route config.
    - >-
      The route must have a service_id. Nothing in this document can confirm it does.
      Without one api-product-enforcer returns 403 regardless of subscription, and the
      error is indistinguishable from a missing subscription.
    - >-
      The per-IP limit-count on POST /orders/search requires real-ip in front if the
      gateway sits behind a proxy or load balancer. Otherwise every caller presents the
      balancer's address, the ceiling becomes a global 20/min cap on that endpoint, and
      you have a self-inflicted outage waiting for a traffic spike. Nothing here can
      determine your topology.
    - >-
      limit-count DOES take policy and redis_host on the route while
      api-product-enforcer does not. The inconsistency is real and is what leads people
      to add Redis settings to the enforcer, where they are rejected.
    - >-
      error_policy fail_close is a commercial decision inherited as a default. It returns
      503 during a quota-backend outage. fail_open serves unmetered traffic you cannot
      account for. Whoever owns the revenue line should know which is live.
    - >-
      Tier limits are illustrative. Free must be unusable for production or nobody
      upgrades; Enterprise must match a contractual number rather than being scaled from
      Pro. Reviewers should treat these as values to set commercially, not to inherit.
    - >-
      A per-minute window is assumed. It ABSORBS bursts; a per-second window SHAPES
      them. Requests-per-day windows are the worst of both — a full day's budget can go
      in 40 seconds.
    - >-
      Static API keys are the identity mechanism here, and key-auth validate does not
      check the app's secret. For proof of possession, compose with solution 01 and keep
      the enforcer behind the auth block.
    - >-
      The upstream is bound on the service at import/bind time, not expressed in the
      OpenAPI paths. Nothing in this document can confirm it is reachable.

  assumptions:
    - API "Orders API" with metered paths /orders*. Illustrative.
    - Upstream ceiling ~3,000 req/min. Illustrative — and see the quota arithmetic warning.
    - Four tiers: Free 60, Pro 1000, Enterprise 10000, Internal -1, all per minute. Illustrative.
    - The route has a service_id.
    - Products are created AND deployed to the environment. Creating them is not enough.
    - Two apps exist, subscribed to different products, so isolation can be proven rather
      than merely a limit demonstrated.
    - The gateway is single-node, or quota_policy has been set to redis in plugin_attr.
    - real-ip is present in front of the gateway if it sits behind a proxy.

  not_established_here:
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether api-product-enforcer and helix-auth exist in your org, or what fields they expose.
    - Whether the quota is actually enforced, at what count, or globally versus per node.
    - Whether isolation holds — the single most important behavioural claim in this
      solution, and one only a live two-app test can establish. See verify.sh case 5.
    - Whether the 429 body and the absent Retry-After / X-RateLimit-* headers match what
      is documented.
    - Any request/response behaviour whatsoever.

  performed_by: helix-solution-builder
  verified_this_session: true
