# Gateway validation — this solution was imported, dry-run, deployed and exercised
# against a gateway. The statuses below are the outcome. Re-run
# gateway/verify.sh against your own environment before you rely on it.

gateway_validation:
  solution: 03-api-products
  version: 1.0.0

  dry_run:
    status: PASS

  deployment:
    status: DEPLOYED
    detail: >-
      Deployed ACTIVE with two products (a small Free quota and a large Pro quota)
      and two SEPARATE apps, one on each product — so isolation can be proven, not
      just a limit demonstrated.

  functional_tests:
    executor: gateway/verify.sh
    status: PASS
    detail: >-
      verify.sh exits 0. A Free app is admitted up to its quota then returns 429;
      at that same moment a second app on a different product still returns 200. The
      quota is exact (a clean window serves exactly the configured count then 429s),
      and a product with no quota object is rejected at creation.
    cases:
      - { id: unauthenticated,  expected_status: 401, result: PASS }
      - { id: unknown-key,      expected_status: 401, result: PASS }
      - { id: valid-free-call,  expected_status: 200, result: PASS }
      - { id: quota-exhausted,  expected_status: 429, result: PASS, note: "body {\"error\":\"quota exceeded\"}" }
      - { id: isolation,        expected_status: 200, result: PASS, note: "second app on a different product unaffected — the case that matters" }

  overall: READY
