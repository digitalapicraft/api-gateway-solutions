# Solution manifest — the traceability spine for this package.
# Every artifact below corresponds to this one solution version. If the gateway
# config changes, bump `version` and re-derive the docs and infographic from it
# — never the other way round.

solution:
  name: "API Products: sell tiers you can actually enforce"
  slug: 03-api-products
  version: 1.0.0
  category:
    - API Products & Monetization
    - Traffic Management
  tags: [api-products, quota, rate-limiting, multi-tenant, noisy-neighbour, 429, monetization]

problem:
  statement: >-
    API teams need per-caller throughput limits tied to what a customer bought,
    because one misbehaving integration can exhaust capacity provisioned for
    everyone and because plan tiers sold as "higher throughput" have no technical
    enforcement, without over-provisioning for an unbounded worst case.

business_need:
  summary: >-
    Bound the blast radius of a bad integration to the app responsible rather than
    to every consumer; make sold tiers a real enforced difference so a ceiling
    becomes an upgrade trigger; and change the basis of capacity planning from the
    worst caller's hypothetical peak to the sum of committed quotas. Per-app
    attribution also makes incident triage and chargeback possible.

implementation:
  gateway_capabilities:
    - helix-auth (validate / key-auth)      # identity — resolves the app AND its product subscriptions
    - api-product-enforcer                  # enforces the resolved product's quota, counted per app
    - API Products                          # the tier + quota — the thing you sell (gateway/products.json)
    - request-id                            # a disputed 429 needs something to search on
    - cors                                  # browser access
    - limit-count (route-scoped, per-IP)    # second, independent layer on POST /orders/search only
  custom_code_required: false
  notes: >-
    Quota lives on the PRODUCT and is counted PER APP (the credential) by default.
    Not per IP, not per developer, and never on consumer_name — that is the generic
    gateway reflex and it meters the wrong thing here. quota_key_scope: developer
    pools a developer's apps, which is a real trade-off rather than a tidier
    default: pooling lets one of their apps starve their own production traffic.
    Only the TOP-RANKED subscribed product covering the route's service_id is
    evaluated, and there is NO fallback into a second product when its window is
    spent. Rank is a routing decision, not a chain of budgets.
    quota_policy (local vs redis) and the Redis connection are NOT on the route —
    api-product-enforcer accepts only error_policy and ctx_namespace. They live in
    plugin_attr.api-product-enforcer in the gateway's config.yaml. On more than one
    node it MUST be redis, or each node counts separately and an N-node cluster
    serves roughly N times the quota you sold. This is invisible from the route
    config and is the most common way the solution fails to deliver its promise.
    Note the inconsistency: limit-count DOES take policy and redis_host on the
    route. That difference is what leads people to add Redis settings to the
    enforcer, where they are rejected.
    The per-IP limit-count on the search route requires real-ip in front if the
    gateway sits behind a proxy, or every caller shares the balancer's address and
    the ceiling becomes a global cap on that endpoint.

