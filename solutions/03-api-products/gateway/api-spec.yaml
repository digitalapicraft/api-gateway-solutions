# Solution 03 — API Products: rate limiting via a per-app product quota.
#
# This is the importable artifact: an OpenAPI 3.0.3 document carrying
# x-helix-gateway.plugins. Two ways in: paste the agent prompt into Agent Mode
# (it creates the API, the products, and an app), or import this file + products.json,
# bind the upstream, deploy, and subscribe apps.
#
# RUNNABLE ON A FRESH FREE-TRIAL ORG. The upstream is public
# https://jsonplaceholder.typicode.com, so GET /posts returns real data with no
# backend of your own. Deploy to the "test" environment (the free-trial default).
#
# WHAT THIS DOES — rate limiting the platform-native way.
#   Rate limiting here is the PRODUCT QUOTA. helix-auth identifies the calling app;
#   api-product-enforcer consumes one unit of that app's product quota and returns
#   429 when the window is spent. A quota is a field on the product (see
#   products.json). A misbehaving app exhausts its OWN budget and nobody else's.
#
# THE MODEL (get this right or the config is confidently wrong):
#   Developer = a Consumer · App = a Credential (key/secret) · Product = a bundle
#   of APIs + a quota. Quota lives on the PRODUCT and is counted PER APP by default
#   (quota_key_scope: developer to pool a developer's apps). Not per IP, not on
#   consumer_name.
#
# EXECUTION IS PRIORITY-ORDERED:
#   helix-auth (validate/key-auth) resolves the app + its subscriptions
#   [product resolution] picks the top-ranked subscribed product covering this route
#   api-product-enforcer enforces THAT product's quota; 429 when spent
#
# THE ROUTE MUST HAVE A service_id or api-product-enforcer returns 403 regardless
# of subscription (import assigns one automatically). ROUTES MATCH THE UPSTREAM
# PATHS, so no proxy-rewrite is needed.
#
# QUOTA BACKEND IS NOT CONFIGURED HERE. api-product-enforcer accepts only
# error_policy and ctx_namespace. The local-vs-redis choice lives in
# plugin_attr.api-product-enforcer in the gateway's config.yaml. ON MORE THAN ONE
# NODE it MUST be redis, or each node counts separately and the cluster serves ~N x
# the quota you sold. Invisible from this route config; the single most common way
# this is deployed wrong.
#
# App keys/secrets are provisioned on the credential by the control plane and never
# appear in a spec.

openapi: 3.0.3

info:
  title: Posts API
  version: 1.0.0
  description: >-
    A sample API whose access and throughput are governed by the calling app's
    API Product subscription: each product carries a quota, counted per app. It
    proxies the public jsonplaceholder service, so it returns real data on a fresh
    org; point it at your own upstream when ready.

paths:
  /posts:
    get:
      summary: List posts
      description: Metered against the calling app's product quota. Proxies the upstream's /posts.
      responses:
        '200': { description: Array of posts }
        '401': { description: Missing or unknown API key }
        '403': { description: The calling app is not subscribed to a product covering this API, or the route has no service_id }
        '429': { description: The subscribed product's quota for this window is exhausted }
        '503': { description: The quota backend was unreachable and error_policy is fail_close }

  /posts/{postId}:
    get:
      summary: Get a post
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Post }
        '401': { description: Missing or unknown API key }
        '404': { description: Not found }
        '429': { description: Quota exhausted }

# API-WIDE POLICY.
#
# No analytics plugin — analytics is global on the platform (see solution 04).
x-helix-gateway:
  plugins:
    # 1. IDENTITY. helix-auth validate/key-auth resolves the credential (the App)
    #    by its key — the client id in the apikey header — and makes its product
    #    subscriptions available to the enforcer.
    #
    #    Use helix-auth, NOT a bare static-key plugin. key-auth is a
    #    validate_auth_type value of helix-auth, not a standalone plugin, and it is
    #    what resolves the product subscription. Without a resolved subscription the
    #    enforcer 403s every request — a failure that looks like a subscription
    #    problem but is actually a plugin choice.
    helix-auth:
      mode: validate
      validate_auth_type: key-auth
      apikey:
        source: header
        key: apikey

    # 2. ENFORCEMENT = rate limiting. Consumes one unit of the resolved product's
    #    quota and returns 429 when the window is spent.
    #
    #    error_policy fail_close (default) returns 503 if the quota backend is
    #    unreachable. Switch to fail_open only as a deliberate decision to serve
    #    unmetered traffic during an incident. The quota BACKEND is not set here —
    #    see the header comment about redis on multi-node gateways.
    api-product-enforcer:
      error_policy: fail_close

    # 3. Correlation id — a disputed 429 needs something to search on.
    request-id:
      algorithm: uuid
      header_name: X-Request-Id

    cors:
      allow_origins: "*"
      allow_methods: "GET,OPTIONS"
      allow_headers: "apikey,content-type"
      allow_credential: false
