problem:
  statement: Key material written into a route works for the first counterparty and degrades from
    there. Fourteen partners means fourteen near-identical routes, fourteen keys inside configuration
    documents, and a release every time a partner rotates on their own schedule — discovered,
    more often than not, by a file that starts failing on a Friday afternoon.
business_need:
  summary: 'Make the key data rather than configuration: one route serves every counterparty,
    adding a partner is a write, and rotation is a write that takes effect on the next request.
    No key material appears in the configuration document at all. The cost is a write path that
    must be protected, and a second plugin whose reference grammar fails silently when it is wrong.'
implementation:
  gateway_capabilities:
  - key-value-map (inserts)
  - key-value-map (fetch)
  - pgp-crypto (encrypt)
  - proxy-rewrite
  - request-id
  custom_code_required: false
  notes: 'Read solution 13 first: every crypto behaviour here (base64-of-armor wire format, generic
    errors, whole-body buffering) is established there. This package changes exactly one thing
    — where the key comes from. The coupling between the two plugins is a resolved template string.
    The same reference appears twice on the read route: once for key-value-map to decide what
    to fetch, once for pgp-crypto to decide what to read. The grammar is $request.headers.<name>
    (PLURAL — the singular resolves to nothing, silently), $request.query.<name>, $request.body.<dotted.path>,
    $response.*, $consumer.<suffix> and $ctx.<path>. A key-value-map MISS is not an error: the
    plugin cannot know whether the value mattered. The consuming plugin''s fail_policy decides
    what an unregistered partner receives, and fail-open there would return the backend''s document
    IN THE CLEAR. There is NO control-plane API for these entries on this build, so the plugin''s
    own `inserts` is the only write path — which is why a registration route exists. Its value
    comes from the request body precisely so that key material stays out of the configuration
    document. Writing a literal key into `inserts` would defeat the entire package.'
  plugins:
  - name: key-value-map
    scope: route
    at: POST /partners/keys · GET /partners/documents
    role: Configured on this solution's routes.
  - name: pgp-crypto
    scope: route
    at: GET /partners/documents
    role: Configured on this solution's routes.
  - name: proxy-rewrite
    scope: route
    at: POST /partners/keys · GET /partners/documents
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
