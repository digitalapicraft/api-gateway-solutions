assumptions:
- API name is "Partner Documents API" with routes /partners/keys and /partners/documents (illustrative).
- The partner id arrives in X-Partner-Id. Any request-resolvable value works; an authenticated
  identity is better.
- The stored value is an armored OpenPGP public key. The store is generic — keys are simply the
  case where being wrong costs most.
- The upstream echoes requests, which is what makes the registration observable in a test.
- The package ships unauthenticated on purpose so the store and the lookup are the only behaviour
  under test.
limitations:
- There is no control-plane API for these entries on this build. The plugin's own `inserts` is
  the only write path, which is why this package ships a registration route at all.
- The registration route is ADMINISTRATIVE and ships unauthenticated. Anybody who can reach it
  can register their own key under any partner id, and that partner's documents are then encrypted
  to them. Protect it before this exists anywhere real.
- The partner id comes from a caller-controlled header as shipped, so any caller can request any
  partner's document. They receive ciphertext they cannot read, which is a reason not to panic
  and not a reason to call it access control.
- A key-value-map miss is silent. The consuming plugin decides what a missing value means, and
  fail-open there returns the backend's document in the clear.
- Registration REPLACES the entry. That is what makes rotation work, and it means a bad write
  destroys the previous value. There is no history and no rollback.
- No versioning and no staged rollout — a newly written key is live on the next request.
- Storing the WRONG key is undetectable from the gateway. The response is well formed and only
  the counterparty discovers the problem.
- The reference grammar fails silently. $request.header.<name> (singular) resolves to nothing,
  and the symptom is indistinguishable from an unregistered partner.
- ctx_namespace on key-value-map and keys_ctx_namespace on the consumer must agree. Both are left
  at the default here so they agree by construction.
- A $request.body.<path> reference requires a JSON body, which is read at request time.
- Entries are stored encrypted at rest and scoped per environment. That is storage-side protection
  and says nothing about how the value reached the gateway.
- A registered-but-unusable key returns 200 carrying the fail-close error body. fail_close_status
  applies only to a store miss, so a key the crypto cannot use (an OpenPGP key with no encryption
  subkey) is emitted as a success and a status-only assertion passes while no document is returned.
  Assert on the body.
- The registration route's status reflects the upstream echo, not the store write — the insert
  happens in the access phase, before proxying — so neither a 2xx nor a 5xx there is evidence
  about the value. Read it back.
- 'The INJECTING consumer cannot be swapped on a free-trial org. lua-callout is the only plan-gated
  plugin on this build, so pgp-crypto is the only way to put a stored value into a proxied call
  here. Reading a value back is not restricted: mocking resolves $ctx.helix.key_value_map.<key>
  on any plan (solution 14-dynamic-mock), but short-circuits the request, so it cannot hand the
  value to an upstream.'
- Every limitation of solution 13 still applies to the crypto itself.
status: READY
