# Test plan — verifying Okta-issued access tokens at the gateway.
#
# Cases 1-6 are executed in order by ../gateway/verify.sh, which exits 0 only if
# all of them hold. Case 7 runs too, but only when you supply a token from a
# second Okta authorization server. The fixtures under requests/ and expected/
# document each case independently so you can run one by hand.
#
# Substitute your own values:
#   {{GATEWAY}}             gateway base URL, e.g. https://<YOUR_GATEWAY_HOST>
#   {{OKTA_TOKEN_URL}}      https://<your-okta-domain>/oauth2/<authServerId>/v1/token
#   {{OKTA_CLIENT_ID}}      the Okta application's client id
#   {{OKTA_CLIENT_SECRET}}  its client secret
#   {{OKTA_SCOPE}}          a scope your authorization server grants to that app
#   {{ACCESS_TOKEN}}        the JWT Okta returned
#   {{OTHER_ISSUER_TOKEN}}  a valid token from a DIFFERENT Okta authorization server

meta:
  solution: 05-okta-jwt
  version: 1.0.0
  executor: gateway/verify.sh
  note: >-
    Cases 1-6 are automated and unconditional. Case 7 (wrong issuer) is automated
    but skipped unless OTHER_ISSUER_TOKEN is supplied, because it needs a second
    authorization server. Case 8 (expiry) requires waiting out the token lifetime
    and case 9 (key rotation) requires rotating an Okta signing key, so both are
    manual and deliberately outside verify.sh.
  status: >-
    EXECUTED 2026-08-30 against THIS spec, deployed verbatim with only the four
    placeholders substituted, using a real IdP-issued token. 7/7. An earlier run
    (2026-08-27) reported PASS against a control configuration with public_key
    pinned; that result is withdrawn — see validation/gateway-validation.yaml.
  known_gap: >-
    audience-mismatch is NOT enforced. A token whose aud is an unrelated API
    returned 200. See case wrong-audience below — it is documented, not asserted,
    because asserting it would codify the weakness as intended behaviour.

cases:
  - id: unauthenticated
    type: negative
    intent: >-
      openid-connect rejects a call carrying no Authorization header, in the access
      phase, before the upstream is contacted — and rejects it with a 401 rather
      than redirecting the caller to Okta.
    request: requests/unauthenticated.http
    expected: expected/unauthenticated.json
    response_notes: >-
      openid-connect rejects in the access phase. The upstream is never contacted,
      so nothing appears in your backend logs. EXECUTED: returns 401. Most caller-
      side failure causes (no header, no Bearer prefix, non-JWT garbage, bad
      signature, alg=none, expired, wrong issuer) return an indistinguishable 401 —
      but a MISSING aud claim returns 403, see missing-audience-403.json. A
      302/303/307 with a Location pointing at your Okta domain means unauth_action
      is still 'auth'. That is a misconfiguration, not an alternative style — API
      clients cannot follow it usefully.
    expected_status: 401
    assertions:
      - status is exactly 401
      - the response is NOT a 302/303/307, and carries no Location header pointing at the Okta domain
    notes: >-
      The redirect is the default behaviour, not an edge case: unauth_action
      defaults to "auth". This case is the one that proves the plugin was
      configured for an API rather than for a browser session.

  - id: okta-token-issue
    type: positive
    intent: >-
      Okta issues an RS256-signed JWT access token to the application. The gateway
      plays no part in this exchange — establishing that is half the point of the
      solution.
    request: requests/okta-token-request.http
    expected: expected/okta-token-200.json
    response_notes: >-
      Okta's own response, not the gateway's. access_token must be a three-segment
      JWT whose header declares alg RS256 and carries a kid. An opaque access_token
      means this authorization server does not issue JWTs, and local JWKS
      verification cannot work — you would need introspection_endpoint instead.
    expected_status: 200
    assertions:
      - body.access_token is present
      - body.access_token has exactly three dot-separated base64url segments
      - the decoded header declares "alg":"RS256"
      - the decoded header carries a "kid"
    notes: >-
      An opaque access_token means this authorization server does not issue JWTs.
      Local JWKS verification then cannot work at all and you would have to switch
      to introspection_endpoint, which puts Okta on the request path.

  - id: valid-token
    type: positive
    intent: A valid Okta-issued Bearer token is accepted on a protected route.
    request: requests/valid-call.http
    expected: expected/valid-200.json
    response_notes: >-
      The upstream's own response body, passed through untouched — this solution
      adds authentication, not transformation. Assert the status and that the body
      is your backend's normal payload. The array below is illustrative for a Posts
      API. X-Access-Token, because set_access_token_header is true.
      set_id_token_header and set_userinfo_header are false, so no X-ID-Token and no
      X-Userinfo — and no userinfo round trip to Okta per request.
    expected_status: 200
    notes: >-
      A 401 here, with a token minted seconds earlier, is almost always
      claim_validator.issuer.valid_issuers not matching the discovery document's
      "issuer" exactly — a trailing slash or /oauth2/default vs the org server is
      enough. A 403 means authentication passed and required_scopes did not.

  - id: forged-signature
    type: negative
    intent: >-
      A structurally valid Okta token whose signature has been replaced is
      rejected. This is the check that proves the RS256 signature is verified
      against Okta's published JWKS rather than the header merely being parsed.
    request: requests/forged-signature.http
    expected: expected/rejected-401.json
    response_notes: >-
      All three are rejected in the access phase and are indistinguishable from each
      other and from a missing token. That is correct security behaviour and
      genuinely hard for an integrator to self-diagnose — which is why request-id is
      on the API and why the README tells you to ask for X-Request-Id first. forged-
      signature: proves the RS256 signature is verified against Okta's JWKS, not
      merely parsed alg-none: proves an unsigned token is refused —
      accept_unsupported_alg defaults to TRUE, so this is not free wrong-issuer:
      proves the token is specific to THIS API, not just valid somewhere
    expected_status: 401
    notes: >-
      A 200 here is the most serious possible failure of this solution: the route
      looks configured and is passing everything through.

  - id: alg-none
    type: negative
    intent: >-
      A token declaring {"alg":"none"} with no signature at all is rejected.
    request: requests/alg-none.http
    expected: expected/rejected-401.json
    expected_status: 401
    notes: >-
      Do not skip this case. accept_unsupported_alg DEFAULTS TO TRUE on this
      plugin — "Ignore ID token signature to accept unsupported signature
      algorithm" — so refusing unsigned tokens is something you switch on, not
      something you get. The spec sets accept_unsupported_alg and accept_none_alg
      to false and pins token_signing_alg_values_expected to RS256.

  - id: malformed-authorization
    type: boundary
    intent: >-
      A valid token sent without the "Bearer " scheme prefix is rejected. Tests the
      header-parsing boundary rather than the signature.
    request: requests/no-bearer-prefix.http
    expected: expected/no-scheme-400.json
    response_notes: >-
      A valid token sent with no auth scheme — 'authorization: <jwt>' rather than
      'authorization: Bearer <jwt>'. EXECUTED against a deployed route: 400 Bad
      Request, not 401. The header is rejected at parse time, before openid-connect
      runs, so no plugin-level WWW-Authenticate is emitted. Three distinct rejection
      codes exist on this solution: 400 (no auth scheme), 401
      (bad/absent/expired/wrong-issuer token), 403 (aud claim missing, or
      required_scopes not satisfied). Client error handling and alerting that keys
      only on 401 will miss two of them. Reproduced on two separate APIs, and with a
      short junk value ('authorization: junk'), so it is the missing scheme rather
      than the token length.
    expected_status: 400
    result: PASS
    notes: >-
      EXECUTED, and the status is 400 — NOT 401. A value carrying no recognised
      auth scheme is rejected at header-parse time, before openid-connect runs.
      Deterministic, and independent of the value's length (a bare "junk" behaves
      the same). An earlier draft of this plan recorded 401; that reading came
      from a broken configuration in which every case returned 401.

  - id: wrong-issuer
    type: negative
    intent: >-
      A correctly signed, unexpired token from a DIFFERENT Okta authorization
      server is rejected. Proves the token is specific to THIS API rather than
      merely valid somewhere.
    request: requests/wrong-issuer.http
    expected: expected/rejected-401.json
    expected_status: 401
    type_of_execution: conditional
    procedure: >-
      Supply OTHER_ISSUER_TOKEN to verify.sh with a token minted by a second Okta
      authorization server (a second custom auth server in the same tenant is
      enough — its issuer differs).
    notes: >-
      This is solution 05's counterpart to solution 01's wrong-client-secret case.
      Note what it does NOT cover: there is no field to pin an arbitrary expected
      AUDIENCE. audience can only be required-present or matched against client_id,
      and Okta access tokens carry aud = the API's audience URI, not the client id.
      Issuer pinning plus required_scopes is the available control. See README
      § Gotchas.

  - id: missing-audience
    type: negative
    intent: >-
      A correctly signed token with NO aud claim is rejected, because
      claim_validator.audience.required is true.
    expected_status: 403
    expected: expected/missing-audience-403.json
    result: PASS
    notes: >-
      Note the status code: 403, NOT 401. This is the one caller-side rejection
      that is distinguishable from the others, and it contradicts the otherwise
      reliable rule that every auth failure here looks identical. Executed.

  - id: alg-confusion
    type: negative
    intent: >-
      A token signed HS256 using the issuer's PUBLIC key as the HMAC secret — the
      classic algorithm-confusion attack — is rejected.
    expected_status: 401
    result: PASS
    notes: >-
      This passes because token_signing_alg_values_expected is pinned to RS256 and
      accept_unsupported_alg is false. Executed against a deployed route.

  - id: issuer-trailing-slash
    type: boundary
    intent: >-
      The same token, with the issuer's trailing slash removed, is rejected —
      demonstrating that valid_issuers is an exact string match.
    expected_status: 401
    result: PASS
    notes: >-
      Executed. The IdP tested reports its issuer WITH a trailing slash. Copy the
      issuer out of the discovery document rather than retyping it.

  - id: wrong-audience
    type: failure
    intent: >-
      Document, rather than assert, that a token minted for a DIFFERENT API is
      accepted. This is a property of the plugin, not of this spec.
    expected_status: 200
    expected: expected/wrong-audience-200.json
    result: >-
      CONFIRMED-GAP — a correctly signed, unexpired token with
      aud=https://totally-unrelated-api.example.com/ returned 200. Reproduced twice.
    notes: >-
      claim_validator.audience has no expected-value field: only required (present
      or not), claim (which name), and match_with_client_id (which does not apply
      to access tokens, whose aud is the API's audience URI). If you must
      distinguish APIs within one tenant, required_scopes is the control that
      works. Do not describe this solution as validating the audience.

  - id: expired-token
    type: boundary
    intent: >-
      A token is rejected once its exp has passed, proving the lifetime is enforced
      rather than merely advertised.
    type_of_execution: manual
    procedure: >-
      1) Obtain a token. 2) Confirm it returns 200. 3) Wait longer than the token
      lifetime your Okta authorization server issues (commonly 3600s; shorten it in
      a test authorization server if you don't want to wait). 4) Replay the SAME token.
    expected_status: 401
    notes: >-
      Outside verify.sh because it requires waiting out the lifetime. The token
      lifetime is set in Okta, not at the gateway — this solution has no token_ttl
      to configure, which is exactly the trade you made by not being the issuer.

  - id: key-rotation
    type: failure
    intent: >-
      Establish what happens when Okta rotates its signing key while the gateway
      still holds a cached JWKS, so the symptom is recognisable in production.
    type_of_execution: manual
    procedure: >-
      In a THROWAWAY Okta authorization server only, rotate the signing key, then
      immediately call the API with a freshly issued token.
    expected_status: 401
    notes: >-
      jwk_expires_in defaults to 86400 — a full day. Until the cache expires the
      gateway can reject perfectly valid, freshly issued tokens. The spec sets
      3600. The diagnostic signature is "every token started 401ing at once, and
      nothing on our side changed".

  - id: cors-preflight
    type: boundary
    intent: >-
      A browser preflight for a protected route permits the authorization header.
      If it doesn't, browser clients fail before the request is made and the
      symptom is a CORS error, not a 401.
    type_of_execution: manual
    procedure: >-
      OPTIONS a protected route with Origin and
      Access-Control-Request-Headers: authorization. Confirm the response's
      Access-Control-Allow-Headers includes authorization.
    notes: Only relevant if browser clients call this API directly.

coverage:
  positive: [okta-token-issue, valid-token]
  negative: [unauthenticated, forged-signature, alg-none, wrong-issuer, missing-audience, alg-confusion]
  boundary: [malformed-authorization, expired-token, issuer-trailing-slash, cors-preflight]
  failure:  [key-rotation, wrong-audience]

executed:
  # What actually ran on 2026-08-27 against a deployed route.
  against_shipped_config: [unauthenticated, forged-signature, alg-none, malformed-authorization]
  against_control_config: [valid-token, wrong-issuer, issuer-trailing-slash, expired-token, missing-audience, alg-confusion, wrong-audience]
  not_run: [okta-token-issue, cors-preflight, key-rotation]
  not_run_reason: >-
    okta-token-issue and the shipped config's acceptance path need a token from the
    live IdP; the test client had no grant for any audience, so none could be
    minted. cors-preflight and key-rotation are manual by design.
