# Solution 05 — checking Okta-issued tokens at the gateway: the basic example spec.
#
# Two routes and nothing else: no plugins. Import this when you want to add the
# plugins yourself in the UI, so you see what each one does. The walkthrough is
# ../guides.md, "Build it in the UI".
#
# The same API with the plugins already in it is api-spec.yaml, next to this file.
#
# Until you add the plugins, nothing here checks a token: every call is simply
# forwarded to the upstream.
#
# RUNNABLE ON A FRESH ORG. The upstream is public
# https://jsonplaceholder.typicode.com, so GET /albums returns real data with no
# backend of your own.

openapi: 3.0.3

info:
  title: Partner Albums API
  version: 1.0.0
  description: >-
    A sample API that proxies the public jsonplaceholder service, so it returns
    real data on a fresh org. Add the plugins yourself to accept only access
    tokens your Okta issued; point it at your own upstream when ready.

paths:
  /albums:
    get:
      summary: List albums
      description: Proxies the upstream's /albums.
      responses:
        '200': { description: Array of albums }
    post:
      summary: Create an album
      description: Proxies the upstream's POST /albums.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, userId]
              properties:
                title:  { type: string }
                userId: { type: integer }
      responses:
        '201': { description: Created }
        '400': { description: Invalid payload }
