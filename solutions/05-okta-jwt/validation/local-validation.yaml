# Local (pre-gateway) validation — a structural review of the importable
# artifacts, plus a schema check against the target org's live plugin schemas.
# It does not, and cannot, establish request-path behaviour.

local_validation:
  solution: 05-okta-jwt
  version: 1.0.0
  status: PASS

  checks:
    syntax:                  PASS   # api-spec.yaml parses as valid OpenAPI 3.0.3; verify.sh parses under bash -n
    schema:                  PASS   # every field in every plugin block was validated against the schema returned by GET /orgs/{orgId}/plugin-schemas on the target org — not from documentation or memory
    required_fields:         PASS   # openid-connect's three required fields (client_id, client_secret, discovery) are all present
    references:              PASS   # <OKTA_ISSUER_URL> is documented as needing to equal the issuer reported by <OKTA_DISCOVERY_URL>; no other cross-field reference exists
    plugin_ordering:         PASS   # openid-connect (2599) runs in the access phase ahead of the upstream; nothing consumes a ctx.* value another plugin produces, so there is no ordering dependency
    plugin_scoping:          PASS   # openid-connect is at the document root deliberately — unlike solution 01 there is no token endpoint that must stay reachable, so API-wide is correct and leaves no unprotected route
    auth_authz_dependencies: PASS   # authentication only; no authorization plugin and no required_scopes, stated as such in README and manifest limitations
    request_response:        PASS   # documented 200/401/404 responses match the design; every rejection path is a 401
    security:                PASS   # no literal secrets; four <OKTA_...> placeholders; the four insecure defaults (unauth_action, ssl_verify, accept_unsupported_alg, absent claim_validator) are all explicitly overridden
    no_commentary_keys:      PASS   # plugin blocks contain schema fields only; all explanation is in YAML comments
    tests_match_impl:        PASS   # all seven verify.sh cases map to plugin fields that exist in the spec; the three manual cases are flagged in tests/test-plan.yaml
    placeholders:            PASS   # <OKTA_DISCOVERY_URL>, <OKTA_ISSUER_URL>, <OKTA_CLIENT_ID>, <OKTA_CLIENT_SECRET>, <YOUR_GATEWAY_HOST> — no real Okta domains, hosts or org ids

  warnings:
    - >-
      openid-connect is NOT present on every build. On the free-trial build the
      entire Authentication category is helix-auth alone, and this solution cannot
      be deployed there at all. Confirm with GET /orgs/{orgId}/plugin-schemas
      before designing around it.
    - >-
      There is no field to pin an arbitrary expected AUDIENCE value.
      claim_validator.audience offers only required, claim and
      match_with_client_id, and Okta access tokens carry aud = the API's audience
      URI rather than the client id. Issuer pinning is the control that exists.
      Any document implying the audience is checked against a value would be wrong.
    - >-
      client_secret is schema-required but is not exercised by local JWKS
      verification. It is used only on the introspection path. A reviewer should
      not conclude from its presence that the secret is protecting anything here.
    - >-
      valid_issuers must equal the issuer reported by the discovery document
      exactly. A trailing slash, or the org authorization server versus a custom
      one, will reject every token with an opaque 401.
    - >-
      jwk_expires_in is set to 3600 rather than the 86400 default. This is a
      deliberate availability choice about how long a stale key cache can survive
      an Okta key rotation, and should be set consciously per environment.
    - >-
      cors.allow_origins is "*", which is right for a public partner API and wrong
      for anything carrying browser session state. allow_credential is false, which
      is what makes the wildcard safe here.
    - >-
      The upstream is bound on the service at import/bind time, not expressed in
      the OpenAPI paths. Nothing in this document can confirm it is reachable.

  assumptions:
    - API "Partner Posts API" with protected paths /posts, /posts/{postId}. Illustrative — replace with yours.
    - Okta is the issuer; the gateway never mints a token.
    - The Okta authorization server issues JWT (not opaque) access tokens.
    - Callers can obtain tokens themselves; no token endpoint is exposed on the gateway.

  not_established_here:
    - Whether a gateway accepts this configuration (that is a dry-run).
    - Whether a real Okta token is accepted, or a forged one rejected (that is a functional test).
    - Whether the discovery URL is reachable from the gateway at request time.
    - Any request/response behaviour whatsoever.
