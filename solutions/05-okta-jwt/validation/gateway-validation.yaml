# Gateway validation — what a live control plane and a live gateway established
# for this solution. Re-run gateway/verify.sh against your own environment before
# relying on it.

gateway_validation:
  solution: 05-okta-jwt
  version: 1.0.0
  import:   { status: PASS, detail: "HTTP 201 — OpenAPI and the openid-connect block accepted, including use_jwks, which is not in the published schema" }
  dry_run:  { status: PASS, detail: 'HTTP 200 {"success": true, "message": "Dry-run validation successful"}' }
  deployment: { status: DEPLOYED, detail: "Revision ACTIVE in a test environment and exercised with a real IdP token" }

  functional_tests:
    executor: manual curl against the deployed route; gateway/verify.sh codifies the same cases
    status: PASS
    summary: 7/7 against the shipped spec.
    cases:
      - { id: valid-token,             expected: 200, actual: 200, result: PASS, note: "returned the upstream's real body" }
      - { id: valid-token-second-route, expected: 200, actual: 200, result: PASS }
      - { id: valid-token-repeat,      expected: 200, actual: 200, result: PASS, note: "stability check" }
      - { id: unauthenticated,         expected: 401, actual: 401, result: PASS, note: "401, not a 302 redirect" }
      - { id: forged-signature,        expected: 401, actual: 401, result: PASS }
      - { id: alg-none,                expected: 401, actual: 401, result: PASS }
      - { id: malformed-authorization, expected: 400, actual: 400, result: PASS, note: "400, NOT 401 — rejected at header parse, before the plugin runs" }

  agent_prompt_run:
    executor: harness/verify-agent.sh (hosted agent, default model)
    date: 2026-09-21
    status: PASS
    detail: >-
      Three routes with cors, openid-connect and request-id. bearer_only true,
      unauth_action deny and use_jwks true all set — the redirect-to-login trap
      avoided — and no helix-auth anywhere.
    verified_by: >-
      get_revision read back after the run; the stored routeSpec was inspected
      directly, not inferred from the agent transcript.

  overall: READY WITH WARNINGS
