assumptions:
- API name is "Storefront API" with routes /storefront/orders and /storefront/checkout (illustrative).
- The callout target is a public sample service standing in for a customer-profile service; replace
  it with yours.
- The upstream echoes request headers, which is what makes the enrichment observable in a test.
- The backend is willing to read three headers. Anything richer than strings has to be flattened.
- The package ships unauthenticated on purpose so the callout is the only behaviour under test.
limitations:
- The callout is synchronous by default — the request waits for it, and `timeout` bounds the worst
  case this route can exhibit. Setting `async` to true exists as an option but makes the response
  unavailable to the request, which defeats the purpose here.
- This is not an authorization decision. The response is stored, never acted on. Rejecting a caller
  based on it needs forward-auth or opa.
- Configured per route. A route added later is not enriched, and the symptom at the backend is
  a missing header rather than an error.
- Mapped values become request headers, so they are strings and are visible to the backend and
  to anything on the path. Map what the backend needs, not the whole profile.
- A dotted path that resolves to nothing yields no value and NO error, so a typo is invisible
  until a backend notices the header is absent.
- Under fail-open the enrichment headers are ABSENT, not empty. Every backend reading them must
  decide explicitly what a missing header means.
- The plugin has no response cache of its own. Every request makes the call.
- It consolidates N calls per request into one; it does not remove the dependency on the profile
  service, and its availability is now in this route's path.
status: READY
