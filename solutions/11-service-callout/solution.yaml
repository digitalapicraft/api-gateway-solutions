problem:
  statement: Several services each begin by calling the same customer-profile service to learn
    the caller's plan and account status. Each caches it differently, each fails differently,
    the profile service carries one call per service per request, and a contract change becomes
    a hunt across the estate for copies — one of which is always found by an incident rather than
    by the search.
business_need:
  summary: 'Make the lookup a property of the path rather than of each service: one call, one
    cache, one timeout, and one failure policy chosen deliberately per route. The payoff that
    funds it is onboarding — a new service behind the route reads a header instead of implementing
    the lookup first.'
implementation:
  gateway_capabilities:
  - service-callout (phase rewrite)
  - proxy-rewrite (headers.set)
  - request-id
  custom_code_required: false
  notes: 'Two things decide whether this works, both verified against a gateway. First, phase
    MUST be rewrite. proxy-rewrite runs in the rewrite phase, so an access-phase callout produces
    its values after the injection has happened — the route returns 200 with no headers and no
    error. Within the rewrite phase service-callout (2003) runs before proxy-rewrite (1008). Phase
    beats priority. Second, the bridge is a gateway variable named literally ctx.helix.<ctx_namespace>.<field>,
    dots included, which proxy-rewrite resolves as ${ctx.helix.service_callout.tenant_plan}. headers.set
    is required rather than headers.add: set REPLACES a client-supplied header. With add, any
    caller could assert its own tenant plan. Verified. This is NOT an authorization decision.
    service-callout stores a response; it does not act on it. Use forward-auth or opa where a
    verdict is needed.'
  plugins:
  - name: proxy-rewrite
    scope: route
    at: GET /storefront/orders · POST /storefront/checkout
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
  - name: service-callout
    scope: route
    at: GET /storefront/orders · POST /storefront/checkout
    role: Configured on this solution's routes.
