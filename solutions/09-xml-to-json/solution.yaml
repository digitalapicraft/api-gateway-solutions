assumptions:
- API name is "Catalog API" with routes /catalog/items and /catalog/orders (illustrative — replace
  with yours).
- The backend replies with application/xml or text/xml. Anything else must be added to content_types.
- The generated request root element is <order> in the namespace urn:example:catalog. Both are
  yours to set.
- The sample upstream echoes requests, which is what makes the request direction observable in
  a test.
- The package ships unauthenticated on purpose so the mediation is the only behaviour under test.
limitations:
- Both conversion gates fail OPEN. A missing Accept header, a content type outside request_content_types,
  or a body over max_body_size all result in a silent passthrough rather than an error, so a 200
  from the gateway is not evidence the conversion happened.
- Attributes on CHILD elements were not present in the converted output in this package's validation
  run; root-element attributes were. Data carried in child attributes is at risk.
- XML has no array type, so a repeatable element that occurs exactly once converts to an object
  rather than a one-item array. This is the classic intermittent client bug after an XML-to-JSON
  migration.
- Empty elements become null, not an empty string and not an absent key.
- Mixed content is reshaped into separate keys with the text rejoined, not preserved.
- JSON object key order is NOT preserved on the way to XML. A backend validating a strict xs:sequence
  can reject a document containing every field it required.
- Setting pretty to true makes the route return 503 on this build, with the connection terminated
  before headers. Verified and isolated to that one option.
- The JSON contract mirrors the XML element for element. There is no independent versioning, so
  a backend refactor is a client-visible change.
- Conversion buffers the body, so large documents cost memory and anything over max_body_size
  is forwarded unconverted.
- Conversion failures surface as BACKEND errors, not gateway errors. Correlation depends on request-id
  being propagated into the backend's logs.
status: READY
