problem:
  statement: A backend serves ordinary REST over HTTP but answers in XML, and every client team
    has written its own XML parser to cope. The conversion exists once per consumer, in a different
    language each time, with a different answer to the same ambiguities — so representation bugs
    are intermittent and land on teams that did not cause them. The backend cannot be changed,
    and every SOAP-to-REST guide starts by building an envelope this system does not have.
business_need:
  summary: Move the conversion to the one place every client already passes through, so a new
    consumer calls an endpoint instead of writing parser number five. Because response conversion
    is content-negotiated, the existing XML consumers keep working through the same route — the
    new front door opens without a migration project, which is usually what decides whether the
    work happens at all.
implementation:
  gateway_capabilities:
  - xml-to-json (transform_response)
  - xml-to-json (transform_request)
  - proxy-rewrite
  - request-id
  - cors
  custom_code_required: false
  notes: 'This is NOT the SOAP solution. Solution 03 builds an envelope and targets one handler
    path; this one mediates plain XML over ordinary REST paths. Using either in the other''s situation
    produces a document the backend rejects. Two switches decide whether anything happens: the
    response transform fires only when the client sends Accept: application/json, and the request
    transform is off unless transform_request is true AND the body''s Content-Type is in request_content_types.
    Both gates fail OPEN — the body is forwarded unchanged with no error. proxy-rewrite (priority
    1008) runs before xml-to-json (997) in the rewrite phase. Setting Content-Type in proxy-rewrite
    breaks the request transform. pretty: true is not safe on this build — a route carrying it
    returns 503 with the connection terminated before headers. root_name and property_naming work.
    body-transformer is the alternative when a template is genuinely needed; json-to-xml solves
    the opposite problem despite its name.'
  plugins:
  - name: cors
    scope: document
    role: Configured on this solution's routes.
  - name: proxy-rewrite
    scope: route
    at: GET /catalog/items · POST /catalog/orders
    role: Configured on this solution's routes.
  - name: request-id
    scope: document
    role: Configured on this solution's routes.
  - name: xml-to-json
    scope: route
    at: GET /catalog/items · POST /catalog/orders
    role: Configured on this solution's routes.
